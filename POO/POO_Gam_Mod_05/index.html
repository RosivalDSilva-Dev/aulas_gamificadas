<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b3a">
<title>Desvios Condicionais</title>
<meta name="description" content="Treino interativo de if, else, else if e switch em Java: condições booleanas, cadeias de decisão, operadores lógicos e os erros mais comuns em provas.">
<style>
:root{
  --bg:#e7edf2; --surface:#ffffff; --surface-2:#f3f7fa;
  --ink:#0f2230; --ink-2:#4a6478; --line:#c6d4de;
  --primary:#15697f; --primary-d:#0e4c5d; --primary-l:#d8ecf1;
  --ok:#1f8a4c; --ok-d:#166b3a; --ok-l:#dcf3e5;
  --bad:#c23b4d; --bad-d:#982b3b; --bad-l:#fae1e4;
  --gold:#e0900a; --gold-l:#fdf0d4;
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1820; --surface:#132633; --surface-2:#0f202b; --ink:#e8f1f6; --ink-2:#9fb6c4;
    --line:#26404f; --primary:#3aa8c4; --primary-d:#2b8299; --primary-l:#123542;
    --ok:#3fbf75; --ok-d:#2c8f56; --ok-l:#102e20; --bad:#f0697c; --bad-d:#b84656; --bad-l:#33161c;
    --gold:#f4b73f; --gold-l:#332611;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI Variable Text","Segoe UI",Roboto,Ubuntu,system-ui,-apple-system,"Helvetica Neue",sans-serif;
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.shell{max-width:560px;margin:0 auto;min-height:100%;padding:0 14px 40px}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -14px 14px;
  padding:10px 14px;background:var(--surface);border-bottom:3px solid var(--primary);
  display:flex;align-items:center;gap:10px;
}
.topbar .grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;
  padding:4px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.pill.xp{color:var(--gold);border-color:var(--gold)}
.pill.hp{color:var(--hp);border-color:var(--hp)}
.bar{height:12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--primary);transition:width .35s ease}
.iconbtn{background:none;border:0;padding:6px;border-radius:9px;cursor:pointer;color:var(--ink-2);font-size:20px;line-height:1}
.iconbtn:hover{background:var(--surface-2)}

h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:.2em 0 .3em;font-weight:700}
h2{font-size:21px;line-height:1.2;letter-spacing:-.01em;margin:0 0 .4em;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
p{margin:0 0 .8em}
.sub{color:var(--ink-2);font-size:15px}

.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.btn{
  display:block;width:100%;padding:14px 16px;border-radius:var(--r);border:0;
  background:var(--primary);color:#fff;font-weight:700;font-size:17px;cursor:pointer;
  box-shadow:0 4px 0 var(--primary-d);margin-bottom:12px;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-d)}
.btn[disabled]{background:var(--line);color:var(--ink-2);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--primary);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.small{padding:10px 12px;font-size:15px}
.row{display:flex;gap:10px}
.row > *{flex:1}
input[type=text]{
  width:100%;padding:13px 14px;border-radius:var(--r);border:2px solid var(--line);
  background:var(--surface-2);color:var(--ink);font-size:17px;font-family:inherit;
}
input[type=text]:focus{border-color:var(--primary);outline:none}
label.f{display:block;font-weight:600;font-size:14px;margin:0 0 5px}

/* ---------- boot ---------- */
.boot{border:2px solid var(--line);border-radius:var(--r);overflow:hidden;background:#0a1620;margin-bottom:16px}
.boot .screen{aspect-ratio:16/9;position:relative;background:
  radial-gradient(120% 90% at 70% 15%,var(--boot1) 0%,var(--boot2) 55%,var(--boot3) 100%);}
.boot .bootline{position:absolute;left:16px;top:16px;color:var(--bootfg);font-size:12px;opacity:0}
.boot .lg{position:absolute;inset:0;display:grid;place-items:center;opacity:0;padding:0 20px;text-align:center}
.boot .lg b{color:#eaf6fb;font-size:clamp(18px,5.6vw,27px);letter-spacing:-.02em;line-height:1.25}
.boot .cursor{display:inline-block;width:9px;height:1.1em;background:var(--bootfg);vertical-align:-2px;margin-left:2px;
  animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
@keyframes fadein{to{opacity:1}}
.boot .bootline{animation:fadein .01s .15s forwards}
.boot .lg{animation:fadein .7s .5s forwards}

/* ---------- mapa de níveis ---------- */
.trail{display:flex;flex-direction:column;gap:10px}
.node{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;
  box-shadow:0 3px 0 var(--line);
}
.node:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.node[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.node .glyph{width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:var(--primary-l);
  display:grid;place-items:center;font-size:23px;border:2px solid var(--line)}
.node.done .glyph{background:var(--ok-l);border-color:var(--ok)}
.node.boss .glyph{background:var(--gold-l);border-color:var(--gold)}
.node .t{flex:1;min-width:0}
.node .t b{display:block;font-size:16px}
.node .t span{font-size:13px;color:var(--ink-2)}
.stars{letter-spacing:1px;font-size:14px;color:var(--gold)}
.stars .off{color:var(--line)}

/* ---------- cena de código ---------- */
.scene{user-select:none;-webkit-user-select:none;border-radius:10px;overflow:hidden;margin-bottom:12px}
.scene.code{background:#0d1b24;color:#d7e6ee;font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;
  padding:14px 10px;line-height:1.85;font-size:13.5px;border:2px solid var(--line);overflow-x:auto}
.scene.code .cline{display:flex;gap:10px;white-space:pre;padding:1px 4px;border-radius:6px}
.scene.code .cno{width:18px;flex:0 0 18px;text-align:right;color:#4f7186;user-select:none}
.scene.code .ccode{white-space:pre-wrap;word-break:break-word}
.scene.code .cplain{color:#c7dbe6}
.scene.code .ctok{cursor:pointer;border-radius:4px;padding:1px 2px;border-bottom:2px dotted var(--tok)}
.scene.code .ctok:hover,.scene.code .ctok:active{background:var(--tokbg)}
.zone-hit{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- respostas ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{
  background:var(--surface);border:2px solid var(--line);border-radius:11px;padding:10px 13px;
  font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 3px 0 var(--line);
}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chip.sel{background:var(--primary-l);border-color:var(--primary);color:var(--primary-d)}
.chip.used{opacity:.25;pointer-events:none}
.tray{min-height:54px;border:2px dashed var(--line);border-radius:11px;padding:8px;display:flex;
  flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;background:var(--surface-2)}
.tray:empty::after{content:"Toque nas peças abaixo para montar a resposta";color:var(--ink-2);font-size:13px}
.opt{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;margin-bottom:10px;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:13px;
  box-shadow:0 3px 0 var(--line);font-size:16px;
}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.sel{background:var(--primary-l);border-color:var(--primary)}
.opt .mark{width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}
.opt.sel .mark{background:var(--primary);border-color:var(--primary);color:#fff}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.slotrow{display:flex;align-items:center;gap:9px}
.slotrow .nm{flex:0 0 42%;font-weight:700;font-size:13.5px}
.slot{flex:1;min-height:46px;border:2px dashed var(--line);border-radius:11px;background:var(--surface-2);
  display:flex;align-items:center;padding:6px 9px;font-size:14px;font-weight:600;cursor:pointer}
.slot.full{border-style:solid;background:var(--primary-l);border-color:var(--primary)}

/* ---------- feedback ---------- */
.feed{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:3px solid;background:var(--surface)}
.feed.good{background:var(--ok-l);border-color:var(--ok)}
.feed.bad{background:var(--bad-l);border-color:var(--bad)}
.feed .inner{max-width:560px;margin:0 auto}
.feed b{display:block;font-size:17px;margin-bottom:3px}
.feed.good b{color:var(--ok-d)}.feed.bad b{color:var(--bad-d)}
.feed p{font-size:15px;margin:0 0 10px}
.feed .btn{margin:0}
.spacer{height:150px}
.travado #app{pointer-events:none}
.scene.code{margin:0 0 12px}

/* ---------- relatório ---------- */
.skill{margin-bottom:12px}
.skill .hd{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:4px}
.skill .hd i{font-style:normal;color:var(--ink-2)}
.code{font-family:ui-monospace,Consolas,monospace;font-size:20px;letter-spacing:.14em;font-weight:700;color:var(--primary)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}
.kv b{font-weight:700}
.medal{display:flex;align-items:center;gap:12px;background:var(--gold-l);border:2px solid var(--gold);border-radius:var(--r);padding:12px;margin-bottom:14px}
.medal .m{font-size:34px}
.warn{background:var(--gold-l);border:2px solid var(--gold);border-radius:var(--r);padding:11px;font-size:14px;margin-bottom:14px}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px;font-size:14px;color:var(--ink-2)}
.theory li{margin-bottom:7px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.timer.low{color:var(--bad)}
canvas{max-width:100%;height:auto;border:2px solid var(--line);border-radius:var(--r)}

.pwrow{display:flex;gap:10px;margin-top:10px}
.pwrow input{flex:1}
.pwerr{color:var(--bad-d,#b3261e);font-size:14px;min-height:20px;margin-top:6px}

.secao{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin:16px 4px 6px}
.metabox{background:var(--gold-l);border:1.5px solid var(--gold);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:15px}

.topbar.col{flex-direction:column;align-items:stretch;gap:8px}
.topbar .trow{display:flex;align-items:center;gap:10px}
.topbar .info{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.topbar .info b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .info span{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rodape{max-width:560px;margin:8px auto 0;padding:14px 14px calc(22px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line)}
/* PROF-CSS */
.profbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-l);border:1.5px dashed var(--gold);border-radius:10px;padding:6px 10px;margin:0 0 10px;font-weight:700;font-size:14px}
.profbar .btn{width:auto;margin:0;padding:8px 12px}
.profbox{background:var(--gold-l);border:1.5px dashed var(--gold);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-size:14.5px;font-weight:700}
.gabbox{background:var(--ok-l);border:2px solid var(--ok);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:16px}
.gab-ok{outline:3px solid var(--ok);outline-offset:2px;border-radius:6px;background:var(--ok-l)}
g.gab-ok path,g.gab-ok rect,g.gab-ok polygon,g.gab-ok ellipse{stroke:var(--ok)!important;stroke-width:4px!important}
.gabq{break-inside:avoid;page-break-inside:avoid}
.gabn{display:inline-block;font-weight:800;color:var(--primary);margin-right:6px}
.gabresp{margin-top:8px;font-weight:700;color:var(--ok-d);background:var(--ok-l);border-radius:8px;padding:6px 10px}
.gabops{margin:8px 0 0 22px;padding:0}.gabops li{margin:2px 0}.gabops li.ok{font-weight:800;color:var(--ok-d)}
.gabnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.gabnav .chip{min-width:44px}
.gablv h2{margin:18px 4px 8px}
.gabmont{display:flex;flex-direction:column;align-items:center;gap:2px;margin:6px 0}
.chkrow{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:15px;cursor:pointer}
.chkrow input{width:20px;height:20px;margin-top:2px;flex:none}
@media print{.topbar,.rodape,.noprint,.profbar,.pp-ov{display:none!important}body{background:#fff}.card{border:1px solid #bbb}}
.profbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.gabpp{width:auto;margin:8px 0 0;padding:8px 14px}
/* PASSO-CSS: tela do passo a passo (modo professor) */
body.pp-aberto{overflow:hidden}
.pp-ov{position:fixed;inset:0;z-index:200;background:#eef2f5;display:flex;flex-direction:column;color:#15212b;font-size:16px}
.pp-top{background:#fff;border-bottom:4px solid var(--primary);padding:8px 14px;display:flex;align-items:center;gap:12px;flex:none}
.pp-selo{background:var(--primary);color:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13.5px;white-space:nowrap}
.pp-perg{flex:1;font-weight:800;font-size:18px;line-height:1.25;min-width:0}
.pp-perg small{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.pp-resp{background:var(--primary-l);border-radius:12px;padding:3px 14px;text-align:center;min-width:110px;max-width:34%}
.pp-resp small{display:block;font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--ink-2)}
.pp-resp b{font-size:19px;color:var(--ink-2);line-height:1.2;display:block;overflow-wrap:anywhere}
.pp-resp.ok{background:var(--ok)}.pp-resp.ok small,.pp-resp.ok b{color:#fff}
.pp-x{border:2px solid var(--line);background:#fff;border-radius:10px;width:44px;height:44px;font-size:20px;font-weight:800;cursor:pointer;flex:none}
.pp-main{flex:1;overflow:auto;padding:10px 14px}
.pp-narra{background:#fff;border-radius:14px;border-left:9px solid var(--primary);padding:8px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:10px;display:flex;gap:12px;align-items:center;min-height:68px}
.pp-ic{font-size:30px;flex:none}
.pp-pas{font-size:12.5px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.6px}
.pp-tx{font-size:20px;line-height:1.35;font-weight:600}
.pp-tx code{background:var(--primary-l);color:var(--primary-d);border-radius:6px;padding:0 6px;font-family:ui-monospace,Consolas,monospace;font-size:.92em}
.pp-tx .sim{color:var(--ok);font-weight:800}.pp-tx .nao{color:#d9534f;font-weight:800}
.pp-grade{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.1fr) minmax(290px,1fr);gap:12px;align-items:start}
.pp-pn{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:10px 12px;min-width:0}
.pp-pn h3{font-size:12.5px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.pp-pn h3 i{width:9px;height:9px;border-radius:50%;background:var(--primary);display:inline-block}
.pp-cod{background:#0d1b24;border-radius:10px;padding:8px 0;color:#d7e6ee;font:17px/1.7 ui-monospace,"Cascadia Mono",Consolas,monospace;overflow-x:auto}
.pp-cl{display:flex;align-items:center;padding-right:10px;border-left:5px solid transparent}
.pp-cl .pp-n{width:36px;text-align:right;padding-right:10px;color:#5d7a8a;flex:none;font-size:14px}
.pp-cl .pp-seta{width:18px;flex:none;color:#e8a317;font-weight:900;opacity:0}
.pp-cl pre{margin:0;font:inherit;white-space:pre;tab-size:3;-moz-tab-size:3}
.pp-cl.on{background:rgba(255,233,168,.16);border-left-color:#e8a317}.pp-cl.on .pp-seta{opacity:1}.pp-cl.on .pp-n{color:#ffe9a8}
.pp-sg{background:#e8a317;color:#1b1b1b;border-radius:4px;padding:1px 2px}.pp-sg span{color:inherit}
.pp-kw{color:#7fc8ff}.pp-str{color:#ffcf8a}.pp-num{color:#b8f2a5}
.pp-fx svg{width:100%;height:auto;display:block;max-height:calc(100vh - 250px);min-height:300px}
.pp-no rect,.pp-no polygon,.pp-no path{fill:#BBDEFB;stroke:#1B2733;stroke-width:2}
.pp-no text{font:600 15px ui-monospace,Consolas,monospace;fill:#1B2733}
.pp-no.vis rect,.pp-no.vis polygon,.pp-no.vis path{fill:#d6e9fb}
.pp-no.on rect,.pp-no.on polygon,.pp-no.on path{fill:#ffe9a8;stroke:#e8a317;stroke-width:4;filter:drop-shadow(0 0 6px rgba(232,163,23,.8))}
.pp-ar{fill:none;stroke:#1B2733;stroke-width:2}
.pp-ar.on{stroke:#e8a317;stroke-width:4.5;stroke-dasharray:9 6;animation:ppflui .7s linear infinite}
@keyframes ppflui{to{stroke-dashoffset:-15}}
.pp-lab{font:700 13px Arial,sans-serif;fill:#1B2733}
.pp-mem{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.pp-var{border:2px solid var(--line);border-radius:10px;min-width:84px;text-align:center;overflow:hidden}
.pp-var .nm{background:#f2f5f8;font:700 14px ui-monospace,Consolas,monospace;padding:2px 8px;color:var(--ink-2)}
.pp-var .vl{font:800 24px ui-monospace,Consolas,monospace;padding:3px 8px}
.pp-var.mud{border-color:#e8a317;animation:pppisca .6s}.pp-var.mud .nm{background:#ffe9a8}
@keyframes pppisca{40%{transform:scale(1.12)}}
.pp-leg{font-size:12px;color:var(--ink-2);margin:-2px 0 8px}
.pp-mesaw{overflow-x:auto}
.pp-mesa{width:100%;border-collapse:separate;border-spacing:0;font-size:16px;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.pp-mesa th{background:var(--primary);color:#fff;font-size:13px;padding:6px 5px;text-align:center;font-weight:700;white-space:nowrap}
.pp-mesa td{text-align:center;padding:5px;border-top:1px solid var(--line);font:700 16px ui-monospace,Consolas,monospace;height:34px}
.pp-mesa tr.on td{background:#ffe9a8}.pp-mesa tr.sai td{color:var(--ink-2);background:#f6f7f9}
.pp-mesa td.sim{color:var(--ok)}.pp-mesa td.nao{color:#d9534f}.pp-mesa td.novo{animation:pppisca .5s}
.pp-mesa td.pp-vazio{color:#9aa7b2;font:600 14px inherit}
.pp-tela{margin-top:10px;background:#0b1117;border-radius:10px;padding:9px 12px;color:#8ff0a4;font:700 20px ui-monospace,Consolas,monospace;min-height:52px;position:relative;white-space:pre-wrap;overflow-wrap:anywhere}
.pp-tela small{position:absolute;top:5px;right:9px;font:700 10.5px Arial;color:#5d7a8a;letter-spacing:.6px}
.pp-tela .novo{background:rgba(143,240,164,.22);border-radius:4px}
.pp-cur{display:inline-block;width:10px;height:20px;background:#8ff0a4;vertical-align:-3px;animation:ppcur 1s steps(1) infinite}
@keyframes ppcur{50%{opacity:0}}
.pp-ctl{flex:none;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06);padding:8px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pp-bt{border:2px solid var(--line);background:#fff;border-radius:11px;padding:9px 14px;font-size:16px;font-weight:800;cursor:pointer;color:#15212b}
.pp-bt:disabled{opacity:.4;cursor:default}
.pp-bt.pp-pri{background:var(--primary);border-color:var(--primary);color:#fff;padding:9px 24px}
.pp-bt.on{background:#ffe9a8;border-color:#e8a317}
.pp-trilha{flex:1;min-width:180px;display:flex;gap:3px;align-items:center}
.pp-trilha button{flex:1;height:11px;border:0;border-radius:6px;background:#dfe5ea;cursor:pointer;padding:0;min-width:3px}
.pp-trilha button.feito{background:var(--primary)}.pp-trilha button.at{background:#e8a317;height:17px}
.pp-cont{font-weight:800;color:var(--ink-2);min-width:64px;text-align:right}
@media (max-width:1100px){.pp-grade{grid-template-columns:1fr 1fr}.pp-fx{grid-row:span 2}}
@media (max-width:720px){.pp-grade{grid-template-columns:1fr}.pp-tx{font-size:17px}.pp-resp{display:none}}

ção é true","Tudo fora das chaves roda de qualquer jeito","Sempre precisa de um else","As chaves marcam o que pertence ao if"],"ok":[0,1,3],"e":"O if não exige um else — ele pode existir sozinho, sem alternativa para o caso falso."}]},{"id":3,"nome":"if / else","glyph":"🔀","skill":"H3","teoria":["Quando existe uma alternativa para o caso falso, usamos o else.","Um dos dois blocos sempre executa — nunca os dois ao mesmo tempo."],"qs":[{"t":"hot","skill":"H3","rows":["double media = 5.5;","if (media >= 6.0) {","  [[a|System.out.println(\"Aprovado\");]]","} else {","  [[b|System.out.println(\"Recuperacao\");]]","}"],"p":"Com media = 5.5, toque na linha que será executada.","ok":["b"],"e":"5.5 >= 6.0 é false, então o Java executa o bloco do else: \"Recuperacao\"."},{"t":"type","p":"No código acima, se media fosse 7.0 em vez de 5.5, o que apareceria?","ac":["aprovado","aprovada","aprovado!"],"e":"7.0 >= 6.0 é true, então o bloco do if executa: \"Aprovado\".","rows":["double media = 5.5;","if (media >= 6.0) {","  System.out.println(\"Aprovado\");","} else {","  System.out.println(\"Recuperacao\");","}"]},{"t":"pick","p":"Quantos blocos do if/else executam ao mesmo tempo?","opts":["Sempre só um dos dois","Sempre os dois","Nenhum dos dois","Depende do computador"],"ok":0,"e":"if/else sempre escolhe exatamente um caminho — nunca os dois, nunca nenhum."},{"t":"multi","p":"Sobre if/else, marque as afirmações certas.","opts":["Existe um caminho alternativo para quando a condição é false","Os dois blocos podem rodar juntos","Só um dos blocos roda por vez","O else não tem uma condição própria — ele pega o \"resto\""],"ok":[0,2,3],"e":"O else não testa nada: ele simplesmente cobre todos os casos em que o if deu false."},{"t":"hot","skill":"H3","rows":["double media = 5.5;","if [[c|(media >= 6.0)]] {","  System.out.println(\"Aprovado\");","} else {","  System.out.println(\"Recuperacao\");","}"],"p":"Toque na condição que é testada pelo if.","ok":["c"],"e":"A condição fica entre par izacao é true, então o resultado é true."},{"t":"type","p":"idade = 16, temAutorizacao = false. idade >= 18 || temAutorizacao resulta em?","ac":["false","falso","f"],"e":"Os dois lados são false (16 não é >= 18, e temAutorizacao é false), então o || dá false."},{"t":"type","p":"idade = 20, temAutorizacao = false. idade >= 18 && temAutorizacao resulta em?","ac":["false","falso","f"],"e":"Com &&, os dois precisam ser true. temAutorizacao é false, então o resultado é false."},{"t":"pick","p":"Qual operador exige que AMBAS as condições sejam true?","opts":["&&","||","!","=="],"ok":0,"e":"&& (E) só é true quando os dois lados são true."},{"t":"hot","skill":"H5","rows":["int idade = 16;","boolean temAutorizacao = true;","if [[or|(idade >= 18 || temAutorizacao)]] {","  System.out.println(\"Entrada liberada.\");","}"],"p":"Toque na condição composta que libera a entrada mesmo com idade menor que 18.","ok":["or"],"e":"Com ||, basta uma condição ser true. temAutorizacao == true já libera a entrada, mesmo com idade menor que 18."},{"t":"multi","p":"Sobre os operadores lógicos, marque as afirmações certas.","opts":["&& (E) exige que as duas condições sejam true","|| (OU) basta uma ser true","! (NÃO) inverte o resultado","&& e || fazem exatamente a mesma coisa"],"ok":[0,1,2],"e":"&& e || têm comportamentos opostos: um exige tudo, o outro se contenta com um."},{"t":"type","p":"x = 5. A expressão !(x > 10) resulta em?","ac":["true","verdadeiro","verdade","v"],"e":"x > 10 é false (5 não é maior que 10); o ! inverte para true."}]},{"id":6,"nome":"O comando switch","glyph":"🔘","skill":"H6","teoria":["Quando a decisão compara UMA variável com valores fixos, o switch deixa o código mais limpo que uma fila de else if.","Não esqueça o break! Sem ele, o Java continua executando os casos seguintes (efeito cascata).","Use switch para igualdade com valores fixos (menu, dia da semana). Use if para faixas e comparações como >=, < ou condições compostas."],"qs":[{"t":"hot","skill":"H6","rows":[ /* ---------- cena de código ---------- */
function codeRow(n, raw){
  var re=/\[\[([^|]+)\|([^\]]+)\]\]/g;
  var out="",last=0,m;
  while((m=re.exec(raw))){
    out+= raw.slice(last,m.index).length? '<span class="cplain">'+esc(raw.slice(last,m.index))+'</span>':'';
    out+= '<span class="ctok" data-zone="'+m[1]+'">'+esc(m[2])+'</span>';
    last=re.lastIndex;
  }
  var rest=raw.slice(last);
  if(rest.length)out+= '<span class="cplain">'+esc(rest)+'</span>';
  return '<div class="cline"><span class="cno">'+(n!=null?n:'')+'</span><span class="ccode">'+out+'</span></div>';
}
function sCode(rows){
  return '<div class="scene code">'+rows.map(function(l,i){
    if(Array.isArray(l))return codeRow(l[0],l[1]);
    return codeRow(i+1,l);
  }).join('')+'</div>';
}

/* ---------- utilidades ---------- */
function $(s,c){return (c||document).querySelector(s);}
function el(h){var d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(sorteio()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s).toLowerCase().replace(/,/g,".").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9. ]/g," ").replace(/\s+/g," ").trim();}
function limpaResp(v){
  v=norm(v);var r=/^(aparece|apareceria|imprime|imprimiria|imprimiu|mostra|escreve|sera|seria|resulta em|resultado|o resultado e|o resultado seria|a resposta e|resposta|e|eh|fica|vai imprimir|vai aparecer|o|a|um|uma)\s+/;
  var ant;do{ant=v;v=v.replace(r,"");}while(v!==ant&&v.length>1);
  return v;
}

/* PROF-INI: modo professor (projetor): ordem fixa, ver resposta, sem cronometro e gabarito */
var PROF_KEY="aulas_gamificadas_prof";
var PROF=(function(){try{return JSON.parse(localStorage.getItem(PROF_KEY))||{};}catch(e){return {};}})();
function salvaProf(){try{if(PROF.ok)localStorage.setItem(PROF_KEY,JSON.stringify(PROF));else localStorage.removeItem(PROF_KEY);}catch(e){}}
function profOk(){return !!PROF.ok;}
function modoFixo(){return profOk()&&!!PROF.fixo;}
function timerOn(lv){return !!lv.timer&&!(profOk()&&PROF.semTimer);}
var SEMENTE=null;
function sementeDe(lvid,q){return (h53(String(lvid)+"|"+q.p)%4294967296)>>>0;}
function semear(q){SEMENTE=modoFixo()?sementeDe(jogo.lv.id,q):null;}
function sorteio(){
  if(SEMENTE===null)return Math.random();
  SEMENTE=(SEMENTE+0x6D2B79F5)>>>0;var t=SEMENTE;
  t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);
  return ((t^(t>>>14))>>>0)/4294967296;
}
function filaNivel(lv){lv.qs.forEach(function(q,i){q._n=i+1;});return modoFixo()?lv.qs.slice():shuffle(lv.qs);}
function ordemOps(lvid,q){var s=SEMENTE;SEMENTE=sementeDe(lvid,q);var o=shuffleIdx(q);SEMENTE=s;return o;}
var LETRAS="abcdefghij";
var NOMEFIG={inicio:"Início",fim:"Fim",entrada:"Entrada",saida:"Saída",proc:"Processamento",decisao:"Decisão"};
var ZONAS={icons:"Ícones de atalho",taskbar:"Barra de tarefas",start:"Botão Iniciar",apps:"Programas abertos (meio da barra)",
  tray:"Bandeja do sistema (relógio e WiFi)",wallpaper:"Área livre do papel de parede",bottom:"Borda de baixo da tela",
  escola:"Pasta Escola",c:"Disco local (C:)",titulo:"Barra de título",fechar:"Botão fechar (X)",endereco:"Barra de endereço",
  conteudo:"Área de conteúdo",status:"Barra de status"};
function zonasCodigo(rows){var m={};(rows||[]).forEach(function(l){var s=Array.isArray(l)?l[1]:l,re=/\[\[([^|]+)\|([^\]]+)\]\]/g,x;while((x=re.exec(s)))m[x[1]]=x[2];});return m;}
function noFluxo(fx,id){var n=null;((fx&&fx.n)||[]).forEach(function(d){if(d.i===id)n=d;});return n;}
function txtFig(d){var t=String(d.t||"").replace(/\n/g," ");return (NOMEFIG[d.k]||d.k)+(t&&d.k!=="inicio"&&d.k!=="fim"?" “"+t+"”":"");}
function gabResp(q,lvid){
  var t=q.t;
  if(t==="pick"){var o=ordemOps(lvid,q);return LETRAS[o.indexOf(q.ok)]+") "+q.opts[q.ok];}
  if(t==="multi"){var o2=ordemOps(lvid,q);return q.ok.map(function(i){return LETRAS[o2.indexOf(i)]+") "+q.opts[i];}).join(" · ");}
  if(t==="type")return q.ac[0];
  if(t==="order")return q.items.map(function(s,i){return (i+1)+") "+s;}).join("   ");
  if(t==="slots")return q.pairs.map(function(p){return p[0]+" → "+p[1];}).join(" · ");
  if(t==="keys")return (q.combo||[]).join(" + ");
  if(t==="figura")return NOMEFIG[q.opts[q.ok]]||q.opts[q.ok];
  if(t==="montar")return q.items.map(function(it){return txtFig({k:it[0],t:it[1]});}).join(" → ");
  if(t==="hot"){
    if(q.rows){var z=zonasCodigo(q.rows);return q.ok.map(function(k){return z[k]||k;}).join(" · ");}
    if(q.ok.indexOf("taskbar")>=0)return "Barra de tarefas (qualquer parte dela)";
    return q.ok.map(function(k){return ZONAS[k]||k;}).join(" · ");
  }
  if(t==="hotf")return q.ok.map(function(k){var d=noFluxo(q.fluxo,k);return d?txtFig(d):k;}).join(" · ");
  if(t==="esq")return (q.holes||[]).map(function(k){var d=noFluxo(q.fx,k);return d?txtFig(d):k;}).join(" · ");
  if(t==="compl")return (q.resp||[]).map(function(r,i){return "lacuna "+(i+1)+": "+r;}).join(" · ");
  if(t==="qflux")return "o desenho abaixo";
  if(t==="exec")return "siga o fluxograma com "+Object.keys(q.entradas||{}).map(function(k){return k+" = "+q.entradas[k];}).join(", ");
  if(t==="missao")return "o valor de teste muda com o nome do aluno; veja o modelo";
  if(q.ac)return q.ac[0];
  return "veja a explicação";
}
function gabVisual(q,live,lvid){
  var h="",F=typeof sFluxo==="function",M=typeof miniForma==="function";
  if(!live){
    if(q.rows&&q.t!=="qflux")h+=sCode(q.rows);
    if(q.scene&&typeof SCENES!=="undefined"&&SCENES[q.scene])h+=SCENES[q.scene]();
    if(F&&q.fluxo)h+=sFluxo(q.fluxo,{zonas:true,max:340});
    if(M&&q.k)h+='<div style="text-align:center">'+miniForma(q.k,q.txt||"",160)+'</div>';
    if(q.t==="pick"||q.t==="multi"){
      var ok=q.t==="pick"?[q.ok]:q.ok;
      h+='<ol type="a" class="gabops">'+ordemOps(lvid,q).map(function(i){return '<li'+(ok.indexOf(i)>=0?' class="ok"':'')+'>'+esc(q.opts[i])+(ok.indexOf(i)>=0?' ✔':'')+'</li>';}).join("")+'</ol>';
    }
  }
  if(q.t==="qflux"){if(!live&&q.rows)h+=sCode(q.rows);if(F)h+=sFluxo(q.flows[q.ok],{max:340});}
  if(F&&q.fx&&(q.t==="esq"||!live))h+=sFluxo(q.fx,{max:340});
  if(q.t==="compl"&&q.code)h+=sCode(q.code.map(function(l){return l.replace(/\{(\d+)\}/g,function(m,i){return q.resp[+i];});}));
  if(q.t==="missao"&&q.modelo&&!live)h+=sCode(q.modelo);
  if(M&&q.t==="figura")h+='<div style="text-align:center">'+miniForma(q.opts[q.ok],q.txt||"",160)+'</div>';
  if(M&&q.t==="montar")h+='<div class="gabmont">'+q.items.map(function(it){return miniForma(it[0],it[1],150);}).join('<span class="dn">↓</span>')+'</div>';
  return h;
}
function marcaZonas(box,q){
  if((q.t!=="hot"&&q.t!=="hotf")||!q.ok)return;
  Array.prototype.forEach.call(box.querySelectorAll("[data-zone]"),function(z){if(q.ok.indexOf(z.getAttribute("data-zone"))>=0)z.classList.add("gab-ok");});
}
function barraProf(q){
  if(!profOk())return "";
  return '<div class="profbar"><span>📽 Q'+(q._n||"?")+' de '+jogo.lv.qs.length+(modoFixo()?'':' · ordem embaralhada')+'</span>'+
    '<span class="profbtns">'+(PROF.ver&&PASSO.preparar(q)?'<button class="btn ghost small" id="passoBtn" type="button">▶ Passo a passo</button>':'')+
    (PROF.ver?'<button class="btn ghost small" id="verResp" type="button">👁 Ver resposta</button>':'')+'</span></div>';
}
function ligaProf(q,area){
  if(!profOk())return;
  if(modoFixo()&&q.t==="pick")Array.prototype.forEach.call(area.querySelectorAll(".opt .mark"),function(m,i){m.textContent=LETRAS[i];});
  var pb=$("#passoBtn");
  if(pb)pb.onclick=function(){PASSO.abrir(q,"Q"+(q._n||"?")+" · Nível "+(LEVELS.indexOf(jogo.lv)+1)+" · "+jogo.lv.nome,gabResp(q,jogo.lv.id));};
  var b=$("#verResp");if(!b)return;
  b.onclick=function(){
    if(b._ab)return;b._ab=true;b.disabled=true;
    marcaZonas(app,q);
    var box=el('<div class="gabbox"><b>✔ Resposta:</b> '+esc(gabResp(q,jogo.lv.id))+gabVisual(q,true,jogo.lv.id)+
      (q.e?'<p class="sub" style="margin:6px 0 0">'+esc(q.e)+'</p>':'')+'</div>');
    var ac=$("#acao");ac.parentNode.insertBefore(box,ac);
  };
}

/* PASSO-INI: passo a passo dos lacos (codigo + fluxograma + memoria + teste de mesa + tela), para o modo professor.
   Le o codigo da questao (q.rows: Portugol, Java ou JavaScript), executa de verdade e monta os passos.
   Se o codigo nao puder ser executado (lacunas, leia, faca-enquanto, erro de proposito), a questao fica sem o botao. */
var PASSO=(function(){
  var TIPOS={inteiro:1,real:1,cadeia:1,logico:1,caracter:1,"int":1,"double":1,"float":1,"long":1,"String":1,"boolean":1,"char":1,"let":1,"var":1,"const":1};
  var SAIDA={"escreva":"pt","System.out.println":"ln","System.out.print":"pr","console.log":"ln"};
  function semZona(s){return String(s).replace(/\[\[[^|\]]*\|([^\]]*)\]\]/g,"$1");}
  function linhas(rows){return (rows||[]).map(function(l){return semZona(Array.isArray(l)?l[1]:l);});}

  /* ---------------- lexico ---------------- */
  function lexar(ls){
    var tk=[],re=/\s+|("(?:[^"\\]|\\.)*")|(\d+(?:\.\d+)?)|([A-Za-z_À-ÿ][\wÀ-ÿ]*(?:\.[A-Za-z_]\w*)*)|(\+\+|--|\+=|-=|\*=|<=|>=|==|!=|&&|\|\||[-+*\/%<>=!(){};,])/g;
    ls.forEach(function(s,ln){
      var m;re.lastIndex=0;
      while(re.lastIndex<s.length){
        var at=re.lastIndex;m=re.exec(s);
        if(!m||m.index!==at)throw "lex";
        if(m[1])tk.push({k:"str",v:JSON.parse(m[1]),ln:ln,a:at,b:re.lastIndex});
        else if(m[2])tk.push({k:"num",v:Number(m[2]),ln:ln,a:at,b:re.lastIndex});
        else if(m[3])tk.push({k:"id",v:m[3],ln:ln,a:at,b:re.lastIndex});
        else if(m[4])tk.push({k:"op",v:m[4],ln:ln,a:at,b:re.lastIndex});
      }
    });
    return tk;
  }

  /* ---------------- sintatico ---------------- */
  function compilar(ls){
    var tk=lexar(ls),p=0,uid=0;
    function ve(v){return tk[p]&&tk[p].v===v&&tk[p].k!=="str";}
    function pega(v){if(!ve(v))throw "esperava "+v;return tk[p++];}
    function opc(v){if(ve(v)){p++;return true;}return false;}
    function txt(a,b){var t1=tk[a],t2=tk[b-1];if(t1.ln!==t2.ln)throw "multi";return ls[t1.ln].slice(t1.a,t2.b);}
    // expressoes
    var NIV=[["||","ou"],["&&","e"],["==","!="],["<","<=",">",">="],["+","-"],["*","/","%"]];
    function expr(n){
      n=n||0;
      if(n===NIV.length)return unario();
      var e=expr(n+1);
      while(tk[p]&&(tk[p].k==="op"||tk[p].k==="id")&&NIV[n].indexOf(tk[p].v)>=0){var o=tk[p++].v;e={k:"bin",o:o,a:e,b:expr(n+1)};}
      return e;
    }
    function unario(){
      if(ve("-")){p++;return {k:"neg",a:unario()};}
      if(ve("!")||ve("nao")){p++;return {k:"nao",a:unario()};}
      var t=tk[p++];if(!t)throw "fim";
      if(t.k==="num")return {k:"num",v:t.v};
      if(t.k==="str")return {k:"str",v:t.v};
      if(t.k==="id"){if(t.v==="verdadeiro"||t.v==="true")return {k:"num",v:true};if(t.v==="falso"||t.v==="false")return {k:"num",v:false};return {k:"var",n:t.v};}
      if(t.v==="("){var e=expr();pega(")");return {k:"par",a:e};}
      throw "expr";
    }
    function exprTxt(){var a=p,e=expr();e.t=txt(a,p);e.ln=tk[a].ln;e.ca=tk[a].a;e.cb=tk[p-1].b;return e;}
    // atribuicao simples (sem ;)
    function atrib(){
      var a=p,decl=false;
      if(tk[p]&&tk[p].k==="id"&&TIPOS[tk[p].v]){p++;decl=true;}
      var nm=tk[p++];if(!nm||nm.k!=="id")throw "nome";
      var s={k:"atr",n:nm.v,ln:nm.ln,id:"n"+(uid++),decl:decl};
      if(opc("++")){s.op="++";}
      else if(opc("--")){s.op="--";}
      else if(ve("=")||ve("+=")||ve("-=")||ve("*=")){s.op=tk[p++].v;s.e=exprTxt();}
      else if(decl){s.op="decl";}
      else throw "atrib";
      s.t=txt(a,p);s.ca=tk[a].a;s.cb=tk[p-1].b;
      return s;
    }
    function bloco(){pega("{");var b=[];while(!ve("}")){if(p>=tk.length)throw "}";var s=cmd();if(s)b.push(s);}pega("}");return b;}
    function corpo(){if(opc(";"))return [];return bloco();}
    function cmd(){
      var t=tk[p];
      if(t.v==="para"||t.v==="for"){
        p++;pega("(");var ini=atrib();pega(";");var c=exprTxt();pega(";");var pas=atrib();pega(")");
        return {k:"for",ini:ini,c:c,pas:pas,b:corpo(),ln:t.ln,id:"n"+(uid++),pt:t.v==="para"};
      }
      if(t.v==="enquanto"||t.v==="while"){
        p++;pega("(");var c2=exprTxt();pega(")");
        return {k:"while",c:c2,b:corpo(),ln:t.ln,id:"n"+(uid++),pt:t.v==="enquanto"};
      }
      if(t.v==="faca"||t.v==="do"){
        p++;var bd=bloco();var tw=tk[p];if(!(ve("enquanto")||ve("while")))throw "do";p++;pega("(");var c4=exprTxt();pega(")");opc(";");
        return {k:"do",c:c4,b:bd,ln:tw.ln,lnIni:t.ln,id:"n"+(uid++),pt:t.v==="faca"};
      }
      if(t.v==="se"||t.v==="if"){
        p++;pega("(");var c3=exprTxt();pega(")");var th=bloco(),el=null,eln=null;
        if(ve("senao")||ve("else")){eln=tk[p].ln;p++;if(ve("se")||ve("if"))el=[cmd()];else el=bloco();}
        return {k:"if",c:c3,th:th,el:el,ln:t.ln,eln:eln,id:"n"+(uid++),pt:t.v==="se"};
      }
      if(t.k==="id"&&SAIDA[t.v]){
        p++;pega("(");var args=[],a0=p;
        if(!ve(")")){args.push(exprTxt());while(opc(","))args.push(exprTxt());}
        var at=ve(")")&&p>a0?txt(a0,p):"";pega(")");opc(";");
        return {k:"out",f:SAIDA[t.v],args:args,t:at,ln:t.ln,id:"n"+(uid++)};
      }
      if(t.v==="{")return {k:"blk",b:bloco()};
      if(t.v===";"){p++;return null;}
      if(t.k==="id"){var s=atrib();opc(";");return s;}
      throw "cmd "+t.v;
    }
    var prog=[];while(p<tk.length){var s=cmd();if(s)prog.push(s);}
    return prog;
  }

  /* ---------------- execucao ---------------- */
  function temLaco(prog){var r=false;(function v(b){b.forEach(function(s){if(s.k==="for"||s.k==="while"||s.k==="do")r=true;if(s.b)v(s.b);if(s.th)v(s.th);if(s.el)v(s.el);});})(prog);return r;}
  function primeiroLaco(prog){var r=null;(function v(b){b.forEach(function(s){if(r)return;if(s.k==="for"||s.k==="while"||s.k==="do")r=s;else{if(s.b)v(s.b);if(s.th)v(s.th);if(s.el)v(s.el);}});})(prog);return r;}
  function ehInt(v){return typeof v==="number"&&Math.floor(v)===v;}
  function fmt(v){if(typeof v==="boolean")return v?"verdadeiro":"falso";return String(v);}
  function aval(e,M,js){
    switch(e.k){
      case "num":case "str":return e.v;
      case "par":return aval(e.a,M,js);
      case "var":if(!(e.n in M))throw "var "+e.n;return M[e.n];
      case "neg":return -aval(e.a,M,js);
      case "nao":return !aval(e.a,M,js);
      case "bin":
        var a=aval(e.a,M,js),b=aval(e.b,M,js);
        switch(e.o){
          case "+":return (typeof a==="string"||typeof b==="string")?fmt(a)+fmt(b):a+b;
          case "-":return a-b;case "*":return a*b;
          case "/":if(b===0)throw "div0";return (!js&&ehInt(a)&&ehInt(b))?Math.trunc(a/b):a/b;
          case "%":return a%b;
          case "<":return a<b;case "<=":return a<=b;case ">":return a>b;case ">=":return a>=b;
          case "==":return a===b;case "!=":return a!==b;
          case "&&":case "e":return a&&b;case "||":case "ou":return a||b;
        }
    }
    throw "aval";
  }
  // a expressao com os valores no lugar das variaveis (para a narracao)
  function subst(e,M){
    switch(e.k){
      case "num":return fmt(e.v);case "str":return '"'+e.v+'"';
      case "var":return e.n in M?(typeof M[e.n]==="string"?'"'+M[e.n]+'"':fmt(M[e.n])):e.n;
      case "par":return "("+subst(e.a,M)+")";
      case "neg":return "-"+subst(e.a,M);
      case "nao":return "não "+subst(e.a,M);
      case "bin":return subst(e.a,M)+" "+e.o+" "+subst(e.b,M);
    }
    return "?";
  }
  function soNum(e){return e.k==="num"||e.k==="str"||(e.k==="neg"&&e.a.k==="num");}
  function H(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function C(s){return "<code>"+H(s)+"</code>";}

  /* ---------------- fluxograma (padrao Mapler) ---------------- */
  var CH=9.2,GAP=30;
  function tam(k,t){
    var w=Math.max(String(t).length*CH,20);
    if(k==="dec")return {w:Math.max(150,w+76),h:72};
    if(k==="sai")return {w:Math.max(110,w+56),h:44};
    if(k==="pil")return {w:110,h:38};
    return {w:Math.max(104,w+32),h:44};
  }
  function txAtr(s){
    if(s.op==="++")return s.n+" = "+s.n+" + 1";
    if(s.op==="--")return s.n+" = "+s.n+" - 1";
    if(s.op==="+=")return s.n+" = "+s.n+" + "+s.e.t;
    if(s.op==="-=")return s.n+" = "+s.n+" - "+s.e.t;
    if(s.op==="*=")return s.n+" = "+s.n+" * "+s.e.t;
    return s.n+" = "+s.e.t;
  }
  function montarFluxo(prog){
    var NOS=[],AR=[];
    function no(id,k,t,cx,y){var z=tam(k,t);var n={id:id,k:k,t:t,x:cx,y:y+z.h/2,w:z.w,h:z.h,top:y,bot:y+z.h};NOS.push(n);return n;}
    function liga(ex,alvo,e){ // ex: saida pendente {de,pts,lab}; e: ponto de entrada {x,y}
      var pts=ex.pts.slice(),u=pts[pts.length-1];
      if(u.x!==e.x){var my=e.y-14;if(u.y<my)pts.push({x:u.x,y:my});pts.push({x:e.x,y:Math.max(my,u.y)});}
      pts.push({x:e.x,y:e.y});
      AR.push({de:ex.de,pa:alvo,pts:pts,lab:ex.lab});
    }
    // devolve {l,r,bot,ent:{x,y},alvo,saidas:[]}; nada se o comando nao vira figura
    function seq(b,cx,y){
      var r=null;
      b.forEach(function(s){
        var x=item(s,cx,r?r.bot+GAP:y);if(!x)return;
        if(!r){r=x;return;}
        r.saidas.forEach(function(ex){liga(ex,x.alvo,x.ent);});
        r={l:Math.max(r.l,x.l),r:Math.max(r.r,x.r),bot:x.bot,ent:r.ent,alvo:r.alvo,saidas:x.saidas};
      });
      return r;
    }
    function simples(id,k,t,cx,y){var n=no(id,k,t,cx,y);return {l:n.w/2,r:n.w/2,bot:n.bot,ent:{x:cx,y:n.top},alvo:id,saidas:[{de:id,pts:[{x:cx,y:n.bot}]}]};}
    function laco(s,cond,corpoB,cx,y){
      var top=y+18,d=no(s.id,"dec",cond+"?",cx,top);
      var c=seq(corpoB,cx,d.bot+GAP);
      var L=Math.max(d.w/2,c?c.l:0)+24,R=Math.max(d.w/2,c?c.r:0)+34;
      var fim=c?c.bot:d.bot;
      if(c){
        AR.push({de:s.id,pa:c.alvo,pts:[{x:cx,y:d.bot},{x:c.ent.x,y:c.ent.y}],lab:"Sim"});
        c.saidas.forEach(function(ex){
          var pts=ex.pts.slice(),u=pts[pts.length-1];
          pts.push({x:u.x,y:fim+16},{x:cx-L,y:fim+16},{x:cx-L,y:y+6},{x:cx-4,y:y+6});
          AR.push({de:ex.de,pa:s.id,pts:pts,volta:true});
        });
      }else{
        AR.push({de:s.id,pa:s.id,pts:[{x:cx,y:d.bot},{x:cx,y:d.bot+14},{x:cx-L,y:d.bot+14},{x:cx-L,y:y+6},{x:cx-4,y:y+6}],lab:"Sim",volta:true});
        fim=d.bot+14;
      }
      return {l:L+6,r:R+6,bot:fim+20,ent:{x:cx,y:y},alvo:s.id,
        saidas:[{de:s.id,lab:"Não",pts:[{x:cx+d.w/2,y:d.y},{x:cx+R,y:d.y},{x:cx+R,y:fim+20}]}],dtop:top};
    }
    function item(s,cx,y){
      if(s.k==="atr"){if(s.op==="decl")return null;return simples(s.id,"proc",txAtr(s),cx,y);}
      if(s.k==="out")return simples(s.id,"sai",s.t||" ",cx,y);
      if(s.k==="blk")return seq(s.b,cx,y);
      if(s.k==="while"){var w=laco(s,s.c.t,s.b,cx,y);w.ent={x:cx,y:w.dtop};return w;}
      if(s.k==="do"){
        var c=seq(s.b,cx,y+18);if(!c)return null;
        var d=no(s.id,"dec",s.c.t+"?",cx,c.bot+GAP);
        c.saidas.forEach(function(ex){liga(ex,s.id,{x:cx,y:d.top});});
        var L=Math.max(d.w/2,c.l)+24;
        AR.push({de:s.id,pa:c.alvo,pts:[{x:cx-d.w/2,y:d.y},{x:cx-L,y:d.y},{x:cx-L,y:y+6},{x:cx-4,y:y+6}],lab:"Sim",volta:true});
        return {l:L+6,r:Math.max(d.w/2,c.r),bot:d.bot,ent:{x:cx,y:c.ent.y},alvo:c.alvo,saidas:[{de:s.id,lab:"Não",pts:[{x:cx,y:d.bot}]}]};
      }
      if(s.k==="for"){
        var i=simples(s.ini.id,"proc",txAtr(s.ini),cx,y);
        var w2=laco(s,s.c.t,s.b.concat([s.pas]),cx,i.bot+GAP-18);
        liga(i.saidas[0],s.id,{x:cx,y:w2.dtop});
        return {l:Math.max(i.l,w2.l),r:Math.max(i.r,w2.r),bot:w2.bot,ent:i.ent,alvo:i.alvo,saidas:w2.saidas};
      }
      if(s.k==="if"){
        var d=no(s.id,"dec",s.c.t+"?",cx,y);
        var probeT=s.th.length?seqMed(s.th):{l:0,r:0},probeE=s.el&&s.el.length?seqMed(s.el):{l:0,r:0};
        var tx=cx+Math.max(d.w/2+14,probeT.l+18),ex=cx-Math.max(d.w/2+14,probeE.r+18);
        var t=s.th.length?seq(s.th,tx,d.bot+22):null,e=s.el&&s.el.length?seq(s.el,ex,d.bot+22):null;
        var sd=[];
        if(t){AR.push({de:s.id,pa:t.alvo,pts:[{x:cx+d.w/2,y:d.y},{x:tx,y:d.y},{x:tx,y:t.ent.y}],lab:"Sim"});sd=sd.concat(t.saidas);}
        else sd.push({de:s.id,lab:"Sim",pts:[{x:cx+d.w/2,y:d.y},{x:tx,y:d.y}]});
        if(e){AR.push({de:s.id,pa:e.alvo,pts:[{x:cx-d.w/2,y:d.y},{x:ex,y:d.y},{x:ex,y:e.ent.y}],lab:"Não"});sd=sd.concat(e.saidas);}
        else sd.push({de:s.id,lab:"Não",pts:[{x:cx-d.w/2,y:d.y},{x:ex,y:d.y}]});
        var bot=Math.max(d.bot,t?t.bot:0,e?e.bot:0)+8;
        sd.forEach(function(q){var u=q.pts[q.pts.length-1];if(u.y<bot)q.pts.push({x:u.x,y:bot});});
        return {l:Math.max(d.w/2,cx-ex+(e?e.l:0)),r:Math.max(d.w/2,tx-cx+(t?t.r:0)),bot:bot,ent:{x:cx,y:d.top},alvo:s.id,saidas:sd};
      }
      return null;
    }
    // medida de uma sequencia sem desenhar (para posicionar as colunas do se)
    function seqMed(b){var n0=NOS.length,a0=AR.length,r=seq(b,0,0);NOS.length=n0;AR.length=a0;return r||{l:0,r:0};}
    var ini=simples("ini","pil","Início",0,0);
    var corpoR=seq(prog,0,ini.bot+GAP);
    ini.saidas.forEach(function(ex){liga(ex,corpoR.alvo,corpoR.ent);});
    var fy=corpoR.bot+GAP;
    var fim=no("fim","pil","Fim",0,fy);
    corpoR.saidas.forEach(function(ex){liga(ex,"fim",{x:0,y:fim.top});});
    // caixa de enquadramento
    var x0=1e9,x1=-1e9,y1=fim.bot;
    NOS.forEach(function(n){x0=Math.min(x0,n.x-n.w/2);x1=Math.max(x1,n.x+n.w/2);});
    AR.forEach(function(a){a.pts.forEach(function(q){x0=Math.min(x0,q.x);x1=Math.max(x1,q.x);});});
    return {nos:NOS,ar:AR,vb:(x0-26)+" -8 "+(x1-x0+70)+" "+(y1+20)};
  }

  /* ---------------- passos ---------------- */
  function simular(prog,js){
    var M={},out="",P=[],tab=[],cols=[],condCols=[],L1=primeiroLaco(prog),volta=0,linha=-1,fixas={},nv=0,laco1=0;
    var LIM_VOLTAS=12,LIM=260;
    function varsDe(e,a){a=a||[];if(e.k==="var"&&a.indexOf(e.n)<0)a.push(e.n);["a","b"].forEach(function(k){if(e[k])varsDe(e[k],a);});return a;}
    function col(n){if(cols.indexOf(n)<0)cols.push(n);}
    function cel(nome,v){if(linha<0||!tab[linha])return;if(fixas[nome])return;tab[linha].v[nome]=v;}
    function passo(o){
      if(P.length>LIM)throw "longo";
      o.M=JSON.parse(JSON.stringify(M));o.out=out;o.tab=JSON.parse(JSON.stringify(tab));o.linha=linha;o.mud=o.mud||[];
      P.push(o);
    }
    passo({no:"ini",ln:null,ic:"🚀",tx:"O programa começa no <b>Início</b>."});
    function atr(s,papel){
      var antes=s.n in M?M[s.n]:undefined,v,tx;
      if(s.op==="decl"){M[s.n]=undefined;return;}
      if(s.op==="++"||s.op==="--"){
        if(!(s.n in M))throw "var";
        v=s.op==="++"?antes+1:antes-1;
        tx=C(s.t)+(s.op==="++"?" soma 1":" tira 1")+" → "+H(fmt(antes))+(s.op==="++"?" + 1":" - 1")+" = <b>"+H(fmt(v))+"</b>.";
      }else{
        var val=aval(s.e,M,js);
        if(s.op==="+=")v=antes+val;else if(s.op==="-=")v=antes-val;else if(s.op==="*=")v=antes*val;else v=val;
        if(s.op==="="&&soNum(s.e))tx=(antes===undefined?"Cria a variável "+C(s.n)+" valendo ":C(s.n)+" passa a valer ")+"<b>"+H(fmt(v))+"</b>.";
        else{
          var conta=s.op==="="?subst(s.e,M):H(fmt(antes))+" "+s.op.charAt(0)+" "+subst(s.e,M);
          tx=C(s.t)+" → "+H(conta)+" = <b>"+H(fmt(v))+"</b>.";
        }
      }
      M[s.n]=v;col(s.n);cel(s.n,v);
      if(papel==="ini")tx="O "+(s.pt?"PARA":"for")+" começa com "+C(s.t)+". Essa parte roda <b>uma vez só</b>.";
      if(papel==="pas")tx="Fim da volta: "+tx;
      return tx;
    }
    function run(b){
      for(var i=0;i<b.length;i++){
        var s=b[i];
        if(s.k==="atr"){if(s.op==="decl"){M[s.n]=undefined;continue;}var t=atr(s);passo({no:s.id,ln:s.ln,seg:[s.ca,s.cb],mud:[s.n],ic:s.op==="="?"📦":"🔁",tx:t});}
        else if(s.k==="out"){
          var txo=s.args.map(function(a){return fmt(aval(a,M,js));}).join("");
          if(s.f==="ln")txo+="\n";
          var antes=out;out+=txo;
          if(linha>=0&&tab[linha])tab[linha].tela=(tab[linha].tela||"")+txo.replace(/\n/g," ");
          var mostra=txo.replace(/\n$/,"");
          passo({no:s.id,ln:s.ln,ic:"🖥️",novo:antes.length,tx:"Mostra na tela: <b>"+(mostra.trim()?H(mostra):"(espaço)")+"</b>"+(s.f==="ln"?" e pula para a linha de baixo.":".")});
        }
        else if(s.k==="blk")run(s.b);
        else if(s.k==="if"){
          var c=!!aval(s.c,M,js);
          if(linha>=0&&tab[linha]){if(condCols.indexOf(s.c.t)<0)condCols.push(s.c.t);tab[linha].c[s.c.t]=c?"Sim":"Não";}
          passo({no:s.id,ln:s.ln,seg:[s.c.ca,s.c.cb],cond:c,ic:"🤔",
            tx:"O "+C(s.pt?"se":"if")+" pergunta: "+H(subst(s.c,M))+"? "+(c?'<span class="sim">Sim</span>, vai pelo caminho do <b>Sim</b>.':'<span class="nao">Não</span>, '+(s.el?"vai pelo "+C(s.pt?"senao":"else")+".":"pula o bloco do "+C(s.pt?"se":"if")+"."))});
          if(c)run(s.th);else if(s.el)run(s.el);
        }
        else if(s.k==="do"){
          var eh1d=s===L1,nv2=0,vist2={},cvd=varsDe(s.c),nomeD=s.pt?"faça-enquanto":"do-while";
          while(true){
            nv2++;
            if(eh1d){volta++;tab.push({volta:volta,v:{},c:{},tela:""});linha=tab.length-1;fixas={};
              Object.keys(M).forEach(function(n){if(M[n]!==undefined){col(n);tab[linha].v[n]=M[n];}});
              cvd.forEach(function(n){fixas[n]=1;});}
            P[P.length-1].tx+=nv2===1?" Agora começa o "+C(s.pt?"faca":"do")+": o bloco roda <b>antes</b> de testar (volta 1).":"";
            var r2=run(s.b);if(r2==="inf")return r2;
            var c5=!!aval(s.c,M,js),ch2=JSON.stringify(M);
            if(eh1d)tab[linha].c[s.c.t]=c5?"Sim":"Não";
            passo({no:s.id,ln:s.ln,seg:[s.c.ca,s.c.cb],cond:c5,ic:c5?"✅":"🛑",lacoT:s.c.t,
              tx:"Fim da volta "+nv2+". Testa a condição do "+nomeD+": "+H(subst(s.c,M))+"? "+(c5?'<span class="sim">Sim</span>, a seta <b>volta</b> e o bloco roda de novo.':'<span class="nao">Não</span>, <b>sai do laço</b>.')});
            if(!c5)break;
            if(vist2[ch2]){P[P.length-1].tx+=" ⚠️ Tudo está igual à volta anterior: esse laço <b>nunca vai parar</b>. A demonstração para aqui.";P[P.length-1].infinito=true;return "inf";}
            vist2[ch2]=1;
            if(nv2>LIM_VOLTAS){P[P.length-1].tx+=" ⚠️ Esse laço <b>não termina</b>. A demonstração para aqui.";P[P.length-1].infinito=true;return "inf";}
          }

        }
        else if(s.k==="for"||s.k==="while"){
          var eh1=s===L1,vistos={},nvolta=0;
          if(s.k==="for"){var t2=atr(s.ini,"ini");passo({no:s.ini.id,ln:s.ln,seg:[s.ini.ca,s.ini.cb],mud:[s.ini.n],ic:"📦",tx:t2});}
          var cv=varsDe(s.c);
          while(true){
            var c2=!!aval(s.c,M,js),chave=JSON.stringify(M);
            if(eh1){
              if(c2){volta++;tab.push({volta:volta,v:{},c:{},tela:""});}else tab.push({volta:"saiu",v:{},c:{},tela:""});
              linha=tab.length-1;fixas={};
              Object.keys(M).forEach(function(n){if(M[n]!==undefined){col(n);tab[linha].v[n]=M[n];}});
              cv.forEach(function(n){fixas[n]=1;});
              tab[linha].c[s.c.t]=c2?"Sim":"Não";
            }

            var nome=s.pt?(s.k==="for"?"PARA":"ENQUANTO"):(s.k==="for"?"for":"while");
            passo({no:s.id,ln:s.ln,seg:[s.c.ca,s.c.cb],cond:c2,ic:c2?"✅":"🛑",lacoT:s.c.t,
              tx:"Testa a condição do "+nome+": "+H(subst(s.c,M))+"? "+(c2?'<span class="sim">Sim</span>, entra no laço (<b>volta '+nvolta+"</b>).":'<span class="nao">Não</span>, <b>sai do laço</b>.')});
            if(!c2)break;
            if(vistos[chave]){P[P.length-1].tx+=" ⚠️ Repare: tudo está igual à volta anterior. Esse laço <b>nunca vai parar</b> (laço infinito). A demonstração para aqui.";P[P.length-1].infinito=true;return "inf";}
            vistos[chave]=1;
            if(nvolta>LIM_VOLTAS){P[P.length-1].tx+=" ⚠️ Já foram "+LIM_VOLTAS+" voltas e a condição continua dando Sim: esse laço <b>não termina</b>. A demonstração para aqui.";P[P.length-1].infinito=true;return "inf";}
            var r=run(s.b);if(r==="inf")return r;
            if(s.k==="for"){var t3=atr(s.pas,"pas");passo({no:s.pas.id,ln:s.ln,seg:[s.pas.ca,s.pas.cb],mud:[s.pas.n],ic:"🔁",tx:t3});}
            P[P.length-1].tx+=" A seta <b>volta</b> para o teste.";
          }
          if(eh1){linha=-1;}
        }
        if(i===b.length-1)continue;
      }
    }
    var fimInf=run(prog)==="inf";
    if(!fimInf){
      var o=out.replace(/\n+$/,"").replace(/\n/g," ").trim();
      passo({no:"fim",ln:null,fim:true,ic:"🏁",tx:o?"Fim! Na tela ficou: <b>"+H(o)+"</b>":"Fim! <b>Nada</b> apareceu na tela."});
    }

    cols.sort(function(a,b){var ia=cvs.indexOf(a),ib=cvs.indexOf(b);if(ia>=0||ib>=0)return (ia<0?99:ia)-(ib<0?99:ib);return 0;});
    return {P:P,cols:cols,condL:L1?L1.c.t:null,condV:cvs,condCols:condCols,infinito:fimInf,saida:out};
  }

  function preparar(q){
    if(q._passo!==undefined)return q._passo;
    q._passo=null;
    try{
      if(!q.rows)return null;
      var ls=linhas(q.rows);if(!/\b(para|for|enquanto|while)\s*\(/.test(ls.join("\n")))return null;
      var js=/\b(let|const|var|console\.log)\b/.test(ls.join("\n"));

      if(!temLaco(prog))return null;
      var sim=simular(prog,js);
      var fx=montarFluxo(prog);
      q._passo={ls:ls,sim:sim,fx:fx,js:js,java:/System\.out|\bint\b/.test(ls.join("\n"))};
    }catch(e){q._passo=null;}
    return q._passo;
  }

function regHab(q,acertou){

function botaoConferir(acao,fn){

}
function ligarConferir(on){var b=$("#conf");if(b)b.disabled=!on;}

var RENDER={
  hot:function(q,area){
    area.innerHTML=sCode(q.rows);
    area.insertBefore(el('<p class="sub">Toque no trecho certo do código.</p>'),area.firstChild);
    area.addEventListener("click",function(ev){
      var z=ev.target.closest("[data-zone]");if(!z)return;
      var ok=q.ok.indexOf(z.dataset.zone)>=0;
      if(!ok){z.classList.add("zone-hit");setTimeout(function(){z.classList.remove("zone-hit");},320);}
      julgar(q,ok);
    });
  },
  pick:function(q,area){
    shuffleIdx(q).forEach(function(i){
      var b=el('<button class="opt"><span class="mark"></span><span>'+esc(q.opts[i])+'</span></button>');
      b.onclick=function(){julgar(q,i===q.ok);};
      area.appendChild(b);
    });
  },
  multi:function(q,area,acao){
    var sel=[];
    shuffleIdx(q).forEach(function(i){
      var b=el('<button class="opt"><span class="mark">✓</span><span>'+esc(q.opts[i])+'</span></button>');
      b.onclick=function(){
        var p=sel.indexOf(i);
        if(p>=0){sel.splice(p,1);b.classList.remove("sel");}else{sel.push(i);b.classList.add("sel");}
        ligarConferir(sel.length===q.ok.length);
      };
      area.appendChild(b);
    });
    botaoConferir(acao,function(){
      var ok=sel.length===q.ok.length&&sel.every(function(i){return q.ok.indexOf(i)>=0;});
      julgar(q,ok);
    });
  },
  type:function(q,area,acao){
    area.appendChild(el('<input type="text" id="resp" autocomplete="off" autocapitalize="none" placeholder="Escreva a resposta">'));
    if(q.dica)area.appendChild(el('<p class="sub" style="margin-top:8px">Dica: '+esc(q.dica)+'</p>'));
    var inp=$("#resp");
    inp.addEventListener("input",function(){ligarConferir(inp.value.trim().length>0);});
    inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&inp.value.trim()){var b=$("#conf");if(b)b.click();}});
    botaoConferir(acao,function(){
      var v=norm(inp.value);
      var ok=q.ac.some(function(a){return norm(a)===v||norm(a)===limpaResp(v)||limpaResp(a)===limpaResp(v);});
      julgar(q,ok,ok?null:"Resposta esperada: "+q.ac[0]);
    });
    setTimeout(function(){inp.focus();},120);
  },
  order:function(q,area,acao){
    area.appendChild(el('<p class="sub">Toque na ordem certa. Toque de novo em cima para tirar.</p>'));
    var tray=el('<div class="tray" id="tray"></div>');area.appendChild(tray);
    var bank=el('<div class="chips"></div>');area.appendChild(bank);
    var todos=shuffle(q.items.concat(q.extra||[]));
    var montado=[]; // {text, btn}
    todos.forEach(function(it){
      var b=el('<button class="chip'+(q.mono?" mono":"")+'">'+esc(it)+'</button>');
      b.onclick=function(){
        if(b.classList.contains("used")||montado.length>=q.items.length)return;
        montado.push({text:it,btn:b});b.classList.add("used");pintarTray();
      };
      bank.appendChild(b);
    });
    function pintarTray(){
      tray.innerHTML="";
      montado.forEach(function(m,pos){
        var c=el('<button class="chip sel'+(q.mono?" mono":"")+'">'+esc(m.text)+'</button>');
        c.onclick=function(){ montado.splice(pos,1); m.btn.classList.remove("used"); pintarTray(); };
        tray.appendChild(c);
      });
      ligarConferir(montado.length===q.items.length);
    }
    botaoConferir(acao,function(){
      var vals=montado.map(function(m){return m.text;});
      var ok=vals.length===q.items.length&&vals.every(function(v,i){return v===q.items[i];});
      julgar(q,ok,ok?null:"A ordem certa é: "+q.items.join(q.mono?"  ":" → "));
    });
  },
  slots:function(q,area,acao){
    area.appendChild(el('<p class="sub">Toque numa resposta e depois no espaço certo.</p>'));
    var wrap=el('<div class="slots"></div>');
    var bank=el('<div class="chips"></div>');
    var sel=null,posto={};
    q.pairs.forEach(function(pr,i){
      var row=el('<div class="slotrow"><span class="nm">'+esc(pr[0])+'</span><span class="slot" data-i="'+i+'"></span></div>');
      wrap.appendChild(row);
    });
    area.appendChild(wrap);area.appendChild(bank);

    shuffle(q.pairs.map(function(p){return p[1];})).forEach(function(v){
      var b=el('<button class="chip">'+esc(v)+'</button>');
      bots[v]=b;
      b.onclick=function(){
        if(sel===v){sel=null;b.classList.remove("sel");return;}
        Object.keys(bots).forEach(function(k){bots[k].classList.remove("sel");});
        sel=v;b.classList.add("sel");
      };
      bank.appendChild(b);
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".slot"),function(sl){
      sl.onclick=function(){
        var i=sl.dataset.i;
        if(posto[i]){ bots[posto[i]].classList.remove("used"); delete posto[i]; sl.textContent="";sl.classList.remove("full"); }
        if(sel){ posto[i]=sel; sl.textContent=sel; sl.classList.add("full"); bots[sel].classList.add("used"); bots[sel].classList.remove("sel"); sel=null; }
        ligarConferir(Object.keys(posto).length===q.pairs.length);
      };
    });

      var ok=q.pairs.every(function(pr,i){return posto[i]===pr[1];});

  }

function shuffleIdx(q){var a=[];for(var i=0;i<q.opts.length;i++)a.push(i);return shuffle(a);}

function julgar(q,ok,msg){
  if(!jogo||jogo.travado)return;          /* uma resposta por questão: ignora toques extras */
  jogo.travado=true;document.body.classList.add("travado");
  if(cron){clearInterval(cron);cron=null;}
  if(q._vista!==true){ q._vista=true; regHab(q,ok); if(ok)jogo.acertosPrimeira++; }
  if(ok){ jogo.respondidas++; S.xp+=q._rep?4:10; }
  else{ jogo.vidas--; }
  save();

  var f=el('<div class="feed '+(ok?"good":"bad")+'"><div class="inner">'+
    '<b>'+(ok?"Isso mesmo":"Ainda não")+'</b>'+
    '<p>'+esc(msg?msg+" ":"")+esc(q.e)+'</p>'+
    '<button class="btn '+(ok?"ok":"")+'" id="cont">Continuar</button></div></div>');
  document.body.appendChild(f);
  var bc=f.querySelector("#cont");
  bc.onclick=function(){
    if(bc._ok)return;bc._ok=true;
    f.remove();document.body.classList.remove("travado");
    if(!ok){
      if(jogo.vidas<=0){fimNivel(false);return;}
      var copia={};for(var k in q)copia[k]=q[k];copia._rep=true;copia._vista=true;
      jogo.fila.push(copia);
    }
    jogo.idx++;proxima();
  };
  bc.focus();
}

function fimNivel(venceu){

                       quando:new Date().toISOString().slice(0,10)};

      ant.estrelas=Math.max(ant.estrelas,estrelas);
    }
    if(estrelas===3)S.xp+=20;

  var st="";for(var k=1;k<=3;k++)st+=(k<=estrelas?"★":"☆");

    '</div>'+
    (venceu&&pct<100?'<div class="warn">Refaça o nível para tentar as 3 estrelas: as questões vêm embaralhadas.</div>':'')+

function limparVistos(lv){lv.qs.forEach(function(q){delete q._vista;});}

/* ============================================================ RELATÓRIO ============================================================ */
function agregarHab(){
  var r={};
  Object.keys(HAB).forEach(function(h){r[h]={c:0,t:0};});
  LEVELS.forEach(function(lv){
    var st=S.niveis[lv.id];if(!st||!st.hab)return;
    for(var h in st.hab){ if(!r[h])r[h]={c:0,t:0}; r[h].c+=st.hab[h].c; r[h].t+=st.hab[h].t; }
  });
  return r;
}
function codigo(){
  var base=S.nome+"|"+S.xp+"|"+concluidos()+"|"+totalEstrelas()+"|"+GAME.eyebrow+"|"+(new Date().toISOString().slice(0,10));
  var h=5381;for(var i=0;i<base.length;i++){h=((h<<5)+h+base.charCodeAt(i))>>>0;}
  return h.toString(36).toUpperCase().slice(0,6).padStart(6,"X");
}
function medalha(){
  var f=concluidos(),e=totalEstrelas(),totalNv=LEVELS.length;
  if(f>=totalNv&&e>=totalNv*3-2)return ["🏆","Mestre(a) das Decisões"];
  if(f>=totalNv)return ["🥇","Nenhum bug escapou"];
  if(f>=Math.ceil(totalNv*0.6))return ["🥈","Depurador(a) em treino"];
  if(f>=Math.ceil(totalNv*0.3))return ["🥉","Estagiário(a) de lógica"];
  return ["🧩","Começando agora"];
}

  var fracos=Object.keys(HAB).filter(function(k){var d=hab[k];return d.t&&d.c/d.t<0.75;});
  h+='<div class="card"><h3>O que revisar antes da prova</h3>'+
      (fracos.length? '<ul style="padding-left:20px;margin:0">'+fracos.map(function(k){return "<li>"+esc(HAB[k])+"</li>";}).join("")+'</ul>'
       : '<p class="sub" style="margin:0">'+(concluidos()?"Nada pendente até aqui. Refaça os níveis de menos estrelas para fixar.":"Jogue pelo menos um nível para o relatório mostrar as habilidades.")+'</p>')+
     '</div>';

  h+='<div class="card" style="text-align:center"><h3>Código de verificação</h3>'+
     '<div class="code">'+codigo()+'</div>'+
     '<p class="sub" style="margin:6px 0 0">Mostre este código junto com o print.</p></div>';

  h+='<button class="btn" id="png">Baixar relatório em imagem</button>'+
     '<button class="btn ghost small" id="print">Imprimir ou salvar em PDF</button>'+
     '<button class="btn ghost small" id="volta2">Voltar para a trilha</button>'+
     '<div class="note">Envie a imagem (ou o print desta tela) no Google Classroom.</div>'+
     '<div id="saida"></div>';
  app.innerHTML=h;
  $("#volta").onclick=$("#volta2").onclick=telaMapa;
  $("#print").onclick=function(){window.print();};
  $("#png").onclick=function(){gerarPNG(hab,med);};
  window.scrollTo(0,0);
}
function kv(a,b){return '<div class="kv"><span>'+a+'</span><b>'+b+'</b></div>';}

var COR_TEMA="#0b6b3a";
function gerarPNG(hab,med){
  var totalNv=LEVELS.length;
  var W=900,H=1282,c=document.createElement("canvas");c.width=W;c.height=H;
  var x=c.getContext("2d");
  var F='"Segoe UI",Roboto,system-ui,sans-serif';
  x.fillStyle="#ffffff";x.fillRect(0,0,W,H);
  x.fillStyle=COR_TEMA;x.fillRect(0,0,W,120);
  x.fillStyle="#ffffff";x.font="700 30px "+F;x.fillText(GAME.eyebrow,48,58);
  x.font="400 19px "+F;x.fillText(GAME.titulo.replace(/<[^>]+>/g,"")+" · relatório de treino",48,92);

  var y=170;
  x.fillStyle="#0f2230";x.font="700 30px "+F;x.fillText(S.nome,48,y);y+=34;
  x.fillStyle="#4a6478";x.font="400 20px "+F;
  x.fillText((S.turma||"Turma não informada")+"  ·  "+new Date().toLocaleDateString("pt-BR"),48,y);y+=46;

  x.fillStyle="#fdf0d4";x.fillRect(48,y-28,W-96,64);
  x.fillStyle="#e0900a";x.fillRect(48,y-28,6,64);
  x.fillStyle="#0f2230";x.font="700 24px "+F;x.fillText(med[0]+"  "+med[1],70,y+10);y+=88;

  function linha(a,b){
    x.fillStyle="#4a6478";x.font="400 20px "+F;x.fillText(a,48,y);
    x.fillStyle="#0f2230";x.font="700 20px "+F;x.textAlign="right";x.fillText(String(b),W-48,y);x.textAlign="left";
    x.strokeStyle="#e2eaf0";x.beginPath();x.moveTo(48,y+12);x.lineTo(W-48,y+12);x.stroke();y+=42;
  }
  x.fillStyle="#0f2230";x.font="700 22px "+F;x.fillText("Resumo",48,y);y+=34;
  linha("Meta da aula",metaTxt());
  linha("Níveis concluídos",concluidos()+" de "+totalNv);
  linha("Estrelas",totalEstrelas()+" de "+(totalNv*3));
  linha("XP acumulado",S.xp);
  linha("Tempo de estudo",fmtTempo(S.tempo||0));
  linha("Sessões",(S.sessoes||1));
  linha("Saídas da página durante o jogo",(S.saidas||0));
  y+=22;

  x.fillStyle="#0f2230";x.font="700 22px "+F;x.fillText("Habilidades avaliadas",48,y);y+=34;
  Object.keys(HAB).forEach(function(k){
    var d=hab[k],p=d.t?Math.round(d.c/d.t*100):0;
    x.fillStyle="#0f2230";x.font="400 16px "+F;
    var txt=HAB[k];
    x.fillText(txt.length>66?txt.slice(0,64)+"…":txt,48,y);
    x.textAlign="right";x.font="700 17px "+F;x.fillText(d.t?p+"%":"—",W-48,y);x.textAlign="left";
    y+=12;
    x.fillStyle="#e2eaf0";x.fillRect(48,y,W-96,12);
    x.fillStyle=!d.t?"#c6d4de":p>=75?"#1f8a4c":p>=50?"#e0900a":"#c23b4d";
    x.fillRect(48,y,(W-96)*p/100,12);
    y+=38;
  });

  y+=10;
  x.fillStyle="#f3f7fa";x.fillRect(48,y,W-96,74);
  x.fillStyle="#4a6478";x.font="400 18px "+F;x.fillText("Código de verificação",70,y+30);
  x.fillStyle=COR_TEMA;x.font="700 30px ui-monospace,Consolas,monospace";x.fillText(codigo(),70,y+62);
  x.fillStyle="#4a6478";x.font="400 16px "+F;x.textAlign="right";
  x.fillText("Rosival Silva · 2026",W-70,y+62);x.textAlign="left";

  var saida=$("#saida");saida.innerHTML="";
  try{
    c.toBlob(function(b){
      if(!b){saida.appendChild(c);return;}
      var u=URL.createObjectURL(b),a=document.createElement("a");
      a.href=u;a.download="relatorio-"+STORE+"-"+norm(S.nome).replace(/ /g,"-")+".png";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},4000);
      saida.appendChild(el('<div class="note" style="margin-top:12px">Se o download não abrir, use a imagem abaixo: segure o dedo sobre ela para salvar.</div>'));
      saida.appendChild(c);
    },"image/png");
  }catch(e){
    saida.appendChild(el('<div class="note" style="margin-top:12px">Segure o dedo sobre a imagem para salvar.</div>'));
    saida.appendChild(c);
  }
  setTimeout(function(){saida.scrollIntoView({behavior:"smooth",block:"start"});},300);
}

/* ---------- start ---------- */
load();
setInterval(save,15000);
window.addEventListener("beforeunload",save);
telaInicio();
</script>
