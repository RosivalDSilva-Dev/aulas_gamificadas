<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#9f1d1d">
<title>Missão Desktop — Revisão de Sistemas Operacionais (Aula 03)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#8a1b1b;--wall2:#771515;--chrome:#e6e9f0;--paper:#f7f8fb;--ink:#16213e;--dim:#56607f;
  --blue:#9f1d1d;--blueD:#761414;--yel:#ffd23f;--coral:#ff6b4a;--good:#23a664;--bad:#c77700;--line:#16213e;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--wall);
  background-image:radial-gradient(var(--wall2) 1.5px,transparent 1.6px);
  background-size:22px 22px;
  color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.5;min-height:100vh;
}
#app{max-width:940px;margin:0 auto;padding:16px 12px 60px}
.px{font-family:'Pixelify Sans','Courier New',monospace;font-weight:700}
h1,h2,h3{font-family:'Pixelify Sans','Courier New',monospace;margin:0}

/* janela-moldura do jogo */
.frame{background:var(--chrome);border:2px solid var(--line);border-radius:8px;box-shadow:7px 7px 0 #3a0a0a99;overflow:hidden}
.tbar{display:flex;justify-content:space-between;align-items:center;background:var(--blue);color:#fff;padding:7px 12px;font-family:'Pixelify Sans',monospace;font-weight:700;font-size:16px;border-bottom:2px solid var(--line)}
.tbar .wb2{display:flex;gap:5px}
.tbar .wb2 i{width:16px;height:16px;background:#ffffff33;border:1.5px solid #fff;border-radius:3px;display:block}
.tbar .wb2 i:last-child{background:var(--coral)}
.inner{padding:18px}
.small{font-size:13px;color:var(--dim)}
.btn{font:inherit;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:6px;box-shadow:3px 3px 0 var(--line);cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.primary{background:var(--blue);color:#fff}
.btn.warn{background:var(--yel)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.key:focus-visible,.tile:focus-visible,.chip:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
input[type=text],.sm-input{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:#fff;width:100%}

/* login */
.login p{max-width:60ch}
.rules{display:grid;gap:8px;margin:14px 0;padding:0;list-style:none}
.rules li{background:#fff;border:2px solid var(--line);border-radius:6px;padding:9px 12px}
.field{margin:12px 0;max-width:420px}
.field label{display:block;font-weight:600;margin-bottom:4px}

/* mapa */
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.lvl{min-width:260px;flex:1;max-width:360px}
.xpbar{height:16px;background:#fff;border:2px solid var(--line);border-radius:5px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--yel);border-right:2px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin:14px 0}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;color:#555;margin-bottom:4px}
.metabox{background:#fff6d6;border:2px solid #e0b100;border-radius:8px;padding:8px 12px;margin:10px 0}
.pcard{text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:8px;padding:12px 14px;box-shadow:4px 4px 0 var(--line);cursor:pointer}
.pcard:hover{background:#fffbe8}
.pcard .ic{font-size:28px}
.pcard h3{font-size:19px;margin:2px 0}
.pcard.done{background:#e3f6ea}
.pcard.locked{background:#d3d7e2;cursor:not-allowed;box-shadow:none}
.pcard.boss{border-color:var(--coral);grid-column:1/-1}
.stars{letter-spacing:2px;font-size:18px;color:#b98a00}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.badge{background:#fff;border:2px solid var(--line);border-radius:20px;padding:3px 10px;font-size:13px;font-weight:600}

/* jogo */
.hud{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hud-t{font-size:18px}
.who{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.who b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.who{order:3;flex:1 1 100%}}
.rodape{max-width:940px;margin:0 auto;padding:6px 12px calc(26px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:#fbe3df}
.hud-r{display:flex;gap:14px;align-items:center;font-weight:700}
.dots{display:flex;gap:6px;margin:12px 0}
.dot{flex:1;height:10px;background:#fff;border:2px solid var(--line);border-radius:4px}
.dot.now{background:var(--yel)}.dot.ok{background:var(--good)}.dot.bad{background:var(--bad)}
.kind{color:var(--blue);font-size:15px}
.prompt{font-size:19px;font-weight:600;margin:4px 0 10px;max-width:70ch}
.timer{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar{flex:1;height:10px;background:#fff;border:2px solid var(--line);border-radius:5px;overflow:hidden}
.bar-f{height:100%;width:100%;background:var(--blue)}
.bar-f.low{background:var(--coral)}
.tt{font-weight:700;min-width:34px;text-align:right}
.stage,.chbox{-webkit-user-select:none;user-select:none}
.frozen{pointer-events:none}
.fb{margin-top:14px;padding:12px 14px;border:2px solid var(--line);border-radius:8px;box-shadow:4px 4px 0 var(--line)}
.fb.ok{background:#d6f3e2}.fb.bad{background:#fff1dc}
.fb-h{font-weight:700;font-size:18px;font-family:'Pixelify Sans',monospace}
.fb-b{margin:4px 0 10px}

/* peças de arrastar */
.chip{display:inline-block;background:var(--yel);color:#2b2200;border:2px solid var(--line);box-shadow:2px 2px 0 var(--line);padding:7px 11px;border-radius:6px;font-weight:600;font-size:15px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.chip.sel{outline:3px solid var(--coral);outline-offset:1px}
.chip.dragging{opacity:.35}
.chip.ok{background:#a8e6c1}.chip.bad{background:#ffd9a8}
.chip.locked{cursor:default}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:5px 5px 0 #0007}
.dz{border-radius:6px}
.dz.slot{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:44px;min-width:120px;padding:4px;border:2px dashed var(--blue);background:#fff}
.dz.slot.wide{display:flex;width:100%}
.dz.slot.tall{min-height:96px;align-items:flex-start}
.dz.slot.mini{min-width:120px}
.dz.slot.inline{margin:0 3px;vertical-align:middle}
.dz.hover{background:#fff4b8}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:8px;margin-top:6px;background:#d7dcea;border:2px inset #9ba4c4}
.pool-label{margin-top:14px;font-size:13px;color:var(--dim)}
.order .orow{display:flex;align-items:center;gap:10px;margin:6px 0}
.onum{width:30px;height:30px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;font-weight:700;background:#fff;flex:none}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.bucket-t{font-weight:700;margin-bottom:4px}
.bucket-z{display:flex;flex-wrap:wrap;gap:5px;min-height:110px;padding:6px;border:2px dashed var(--blue);background:#fff;align-content:flex-start}
.cloze{font-size:18px;line-height:2.4;background:#fff;border:2px solid var(--line);border-radius:6px;padding:10px 14px}
.mrow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(150px,1fr);gap:10px;align-items:center;margin:7px 0}
.mlabel{font-weight:600}

/* multi */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tile{font:inherit;font-weight:600;text-align:left;background:#fff;border:2px solid var(--line);border-radius:6px;padding:11px 12px;cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.tile.on{background:#f6d5d0;box-shadow:none;transform:translate(2px,2px)}
.tile.ok{background:#a8e6c1}.tile.bad{background:#ffd9a8}

/* simulações do sistema */
.mock{background:var(--paper);color:var(--ink);border:2px solid var(--line);border-radius:6px;overflow:hidden;-webkit-user-select:none;user-select:none}
.desk{display:flex;flex-direction:column;height:300px;max-width:660px;margin:0 auto}
.desk .wall{flex:1;background:linear-gradient(135deg,#7c9cff,#b58cff 60%,#ff9cc4);padding:10px;cursor:pointer}
.icons{display:flex;flex-direction:column;gap:6px;width:92px;padding:6px;border-radius:8px;cursor:pointer}
.ico{font-size:11px;text-align:center;color:#fff;text-shadow:0 1px 2px #000a}
.ico i{display:block;font-style:normal;font-size:24px}
.taskbar{display:flex;align-items:center;gap:8px;background:#dfe3f2;height:46px;padding:0 6px;border-top:2px solid var(--line)}
.start{background:#ffd5cc;border:2px solid #d24c3b;border-radius:6px;padding:6px 10px;font-weight:700;font-size:13px;cursor:pointer}
.tbapps{flex:1;display:flex;gap:6px;padding:4px;border-radius:6px;cursor:pointer;min-height:34px}
.tbapp{width:30px;height:30px;border-radius:6px;background:#fff;display:grid;place-items:center;border:1px solid #9aa2c8}
.tbapp.on{border-bottom:3px solid var(--blue)}
.tray{display:flex;gap:10px;align-items:center;font-size:12px;padding:6px 8px;border-radius:6px;cursor:pointer}
[data-area]:hover{filter:brightness(1.07)}
[data-area].ok,[data-z].ok{outline:4px solid var(--good);outline-offset:-3px}
[data-area].bad,[data-z].bad{outline:4px solid var(--bad);outline-offset:-3px}
.win{max-width:660px;margin:0 auto;background:#fff}
.w-title{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#5f79c4;color:#fff;padding:8px 10px;font-weight:700;font-size:14px}
.w-btns{display:flex;gap:6px;align-items:center}
.wb{width:30px;height:26px;border-radius:5px;display:grid;place-items:center;background:#ffffff40;font-weight:700;cursor:pointer}
.wb.close{background:#ff9aa8;color:#4a0010}
.w-addr{background:#eef0f8;padding:7px 10px;font-size:13px;border-bottom:1px solid #d0d5ec;font-family:ui-monospace,Menlo,monospace}
.w-body{display:flex;min-height:130px}
.w-side{width:32%;background:#f2f4fb;padding:8px 10px;font-size:13px;border-right:1px solid #d0d5ec;line-height:1.8}
.w-content{flex:1;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start}
.wfile{width:88px;text-align:center;font-size:11px}
.wfile i{display:block;height:42px;border-radius:6px;background:#dfe6ff;margin-bottom:3px}
.w-status{background:#eef0f8;padding:5px 10px;font-size:12px;color:var(--dim);border-top:1px solid #d0d5ec}
.w-side .slot,.w-content .slot{width:100%;min-height:80px}
.tag{font-size:10px;background:#16213ecc;color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:600}
.startm{max-width:440px;margin:0 auto;padding:12px;background:#e8ecfa}
.sm-cap{font-size:12px;color:var(--dim);margin-bottom:8px}
.sm-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.sm-ic{font-size:22px;width:28px;text-align:center;padding-top:6px}
.sm-box{max-width:440px;margin:0 auto;padding:14px;background:#e8ecfa}
.sm-res{margin-top:10px;font-size:14px;color:var(--dim)}
.tree{max-width:540px;margin:0 auto;padding:10px 12px}
.fold,.file{padding:5px 8px;border-radius:6px;cursor:pointer;font-size:14px}
.fold:hover,.file:hover{background:#dfe6ff}
.kids{display:none;margin-left:16px;border-left:2px solid #c3cbe8;padding-left:6px}
.node.open>.kids{display:block}
.node.open>.fold .car{transform:rotate(90deg)}
.car{display:inline-block;transition:transform .15s;margin-right:4px}
.file.ok{background:#a8e6c1}.file.bad{background:#ffd9a8}
.cfg{max-width:540px;margin:0 auto;padding:12px}
.cfg-h{font-weight:700;margin-bottom:8px}
.cfg-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cfg-t{background:#fff;border:2px solid #b8c0e2;border-radius:8px;padding:12px 6px;text-align:center;font-size:13px;font-weight:700;cursor:pointer}
.cfg-t i{display:block;font-style:normal;font-size:24px;margin-bottom:4px}
.cfg-t.ok{background:#a8e6c1;border-color:var(--good)}.cfg-t.bad{background:#ffd9a8;border-color:var(--bad)}
.serp{max-width:580px;margin:0 auto;display:grid;gap:8px}
.urlbar{background:#fff;border:1px solid #b8c0e2;border-radius:20px;padding:6px 12px;font-size:13px;margin:8px}
.res{background:#fff;border:2px solid #cdd3ee;border-radius:8px;padding:9px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.res .u{color:#1a7f37;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.res .tt2{color:#1a0dab;font-weight:700}
.res.ad{background:#fff3b0;border:2px dashed #d9a400}
.res.ok{background:#a8e6c1;border-color:var(--good)}.res.bad{background:#ffd9a8;border-color:var(--bad)}

/* teclado virtual */
.combo{background:#0d1530;border:2px solid var(--line);color:#7ff0ff;border-radius:6px;padding:12px;text-align:center;font-family:'Pixelify Sans',monospace;font-size:22px;min-height:54px;margin-bottom:10px}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
.key{font:inherit;font-weight:700;background:#fff;color:var(--ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:7px;min-width:54px;padding:9px 12px;cursor:pointer}
.key.mod{background:#e3e0ff}
.key.on{background:var(--yel);border-bottom-width:2px;transform:translateY(3px)}

/* cartão */
.cardp{background:#fff;border:3px solid var(--line);border-radius:8px;padding:16px;box-shadow:5px 5px 0 var(--line)}
.cardp h2{font-size:24px}
.crow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--chrome);border:2px solid var(--line);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-family:'Pixelify Sans',monospace}
.ptab{width:100%;border-collapse:collapse;margin:8px 0}
.ptab td,.ptab th{border:2px solid var(--line);padding:5px 8px;text-align:left;font-size:14px}
.ptab th{background:var(--chrome)}
.code{font-family:'Pixelify Sans',monospace;font-size:26px;letter-spacing:3px;background:var(--yel);border:2px solid var(--line);border-radius:6px;padding:4px 12px;display:inline-block}
.review{background:#fff;border:2px solid var(--line);border-radius:6px;padding:8px 14px;margin:10px 0}
.review li{margin:6px 0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:1000;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(700deg)}}
@media(max-width:560px){.inner{padding:12px}.prompt{font-size:17px}.mrow{grid-template-columns:1fr}.cfg-g{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){.confetti{display:none}}
@media print{body{background:#fff}.noprint{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<footer class="rodape">Rosival Silva · 2026</footer>
<script>
(()=>{
'use strict';
/* ================= CONFIG ================= */
// PROFESSOR: troque o texto abaixo por algo só seu ANTES de publicar (e não mude mais depois).
const SALT='SO03-troque-este-texto-secreto';
const LS='missao-desktop-so03-v1';
const APP=document.getElementById('app');

/* ================= UTILIDADES ================= */
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v===false||v==null) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(c)); });
  return e;
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash32(s){let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619);}return x>>>0;}
function rng(seed){
  let a=seed>>>0;
  const f=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};
  f.int=n=>Math.floor(f()*n);
  f.pick=a=>a[f.int(a.length)];
  f.shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=f.int(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
  return f;
}
function frame(title,content){
  return h('div',{class:'frame'},h('div',{class:'tbar'},h('span',{},title),h('span',{class:'wb2'},h('i'),h('i'),h('i'))),h('div',{class:'inner'},content));
}
const mount=(title,node)=>{APP.replaceChildren(frame(title,node));window.scrollTo(0,0);};

/* ================= ESTADO ================= */
let S=load();
function load(){try{return JSON.parse(localStorage.getItem(LS))}catch(e){return null}}
function persist(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
const firstName=()=>{const n=(S&&S.name||'Aluno').trim().split(/\s+/)[0];return n.charAt(0).toUpperCase()+n.slice(1);};
const totalXP=()=>Object.values(S.phases).reduce((a,p)=>a+(p.xp||0),0);
const doneCount=(noBoss)=>Object.entries(S.phases).filter(([id,p])=>p.done&&!(noBoss&&id==='boss')).length;
const LEVELS=[[0,'Estagiário'],[800,'Assistente de TI'],[2000,'Técnico Júnior'],[3500,'Técnico Pleno'],[5000,'Mestre do Desktop']];
function level(xp){let i=0;LEVELS.forEach((l,k)=>{if(xp>=l[0])i=k;});return{i,name:LEVELS[i][1],cur:LEVELS[i][0],next:LEVELS[i+1]?LEVELS[i+1][0]:null};}
function verCode(name,xp,ph,leaves){
  const n=hash32([name.trim().toLowerCase(),xp,ph,leaves,SALT].join('|')).toString(36).toUpperCase().padStart(7,'0');
  return n.slice(0,4)+'-'+n.slice(4);
}

/* som (desligado por padrão) e confete */
let audio=null,muted=true;
function sfx(t){
  if(muted) return;
  try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);
    o.type='square';o.frequency.value=t==='ok'?740:170;g.gain.value=.04;o.start();o.stop(audio.currentTime+.13);}catch(e){}
}
function confetti(){
  const c=h('div',{class:'confetti'});
  for(let i=0;i<50;i++){const p=h('i');p.style.left=Math.random()*100+'%';p.style.background=['#ffd23f','#9f1d1d','#ff6b4a','#23a664'][i%4];p.style.animationDelay=Math.random()*.6+'s';p.style.animationDuration=1.6+Math.random()*1.4+'s';c.append(p);}
  document.body.append(c);setTimeout(()=>c.remove(),3600);
}

/* controle de saídas da página + tempo de uso */
let awayStart=null;
function away(){ if(awayStart==null) awayStart=Date.now(); }
function back(){ if(awayStart!=null){ if(S&&S.name&&Date.now()-awayStart>2500){S.stats.leaves++;persist();} awayStart=null; } }
document.addEventListener('visibilitychange',()=>document.hidden?away():back());
window.addEventListener('blur',away);
window.addEventListener('focus',back);
setInterval(()=>{ if(S&&S.name&&!document.hidden){S.stats.seconds++; if(S.stats.seconds%15===0) persist();} },1000);

/* ================= MOTOR DE ARRASTAR ================= */
function chip(text,key){return h('div',{class:'chip','data-key':key||'',tabindex:'0'},text);}
function slot(key,extra){return h('div',{class:'dz slot '+(extra||''),'data-key':key,'data-cap':'1'});}
function bucket(key,title){return h('div',{class:'bucket'},h('div',{class:'bucket-t'},title),h('div',{class:'dz bucket-z','data-key':key,'data-cap':'99'}));}
function poolOf(chips,r){const p=h('div',{class:'dz pool'});r.shuffle(chips).forEach(c=>p.append(c));return p;}

function enableDnD(root){
  let sel=null,d=null;
  const pool=()=>root.querySelector('.pool');
  const clearSel=()=>{if(sel)sel.classList.remove('sel');sel=null;};
  const isPool=z=>z.classList.contains('pool');
  function place(chipEl,zone){
    if(!isPool(zone)){
      const cap=parseInt(zone.dataset.cap||'1',10);
      const inside=[...zone.children].filter(x=>x.classList.contains('chip')&&x!==chipEl);
      if(inside.length>=cap) pool().append(inside[0]);
    }
    zone.append(chipEl);
  }
  const zoneAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);const z=el&&el.closest('.dz');return z&&root.contains(z)?z:null;};
  root.addEventListener('pointerdown',e=>{
    const c=e.target.closest('.chip');if(!c||c.classList.contains('locked'))return;
    d={chip:c,x:e.clientX,y:e.clientY,moved:false,ghost:null,id:e.pointerId};
    try{c.setPointerCapture(e.pointerId);}catch(_){}
  });
  root.addEventListener('pointermove',e=>{
    if(!d||e.pointerId!==d.id)return;
    if(!d.moved&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>7){
      d.moved=true;d.ghost=d.chip.cloneNode(true);d.ghost.classList.add('ghost');document.body.append(d.ghost);
      d.chip.classList.add('dragging');clearSel();
    }
    if(d.moved){
      d.ghost.style.left=e.clientX+'px';d.ghost.style.top=e.clientY+'px';
      root.querySelectorAll('.dz.hover').forEach(x=>x.classList.remove('hover'));
      const z=zoneAt(e);if(z)z.classList.add('hover');
    }
  });
  const end=e=>{
    if(!d||e.pointerId!==d.id)return;
    const {chip:c,moved,ghost}=d;d=null;
    root.querySelectorAll('.dz.hover').forEach(x=>x.classList.remove('hover'));
    if(moved){
      ghost.remove();c.classList.remove('dragging');
      const z=zoneAt(e);if(z)place(c,z);
    }else{
      const pz=c.parentElement;
      if(sel===c){clearSel();}
      else if(sel&&!isPool(pz)){place(sel,pz);clearSel();}
      else if(sel&&isPool(pz)&&!isPool(sel.parentElement)){place(sel,pool());clearSel();}
      else{clearSel();sel=c;c.classList.add('sel');}
    }
  };
  root.addEventListener('pointerup',end);
  root.addEventListener('pointercancel',end);
  root.addEventListener('click',e=>{
    if(e.target.closest('.chip'))return;
    const z=e.target.closest('.dz');
    if(z&&sel){place(sel,z);clearSel();}
  });
}
function dnd(box,done,layout,poolEl){
  const wrap=h('div',{class:'dnd'},layout,h('div',{class:'pool-label'},'Peças — arraste até o lugar certo (ou toque na peça e depois no lugar)'),poolEl);
  const btn=h('button',{class:'btn primary',onclick:()=>{

      c.classList.add(good?'ok':'bad','locked');

}

/* ---- motor de jogo ---- */
let run=null,tmr=null;
function stopTimer(){if(tmr){clearInterval(tmr);tmr=null;}}
function play(id){
  const ph=PH.find(p=>p.id===id);
  S.attempts[id]=(S.attempts[id]||0)+1;persist();
  const seed=hash32(S.name.toLowerCase().trim()+'|'+id+'|'+S.attempts[id]);
  const rr=rng(seed);const used={};
  const ctx={first:firstName(),uniq(key,list){
    used[key]=used[key]||[];let av=list.filter(x=>!used[key].includes(x));
    if(!av.length){used[key]=[];av=list;}
    const x=rr.pick(av);used[key].push(x);return x;}};
  const list=ph.boss?rr.shuffle(PH.filter(p=>!p.boss).map(p=>rr.pick(p.ch))):ph.ch.slice();
  run={ph,seed,ctx,list,total:list.length,i:0,hearts:3,xp:0,streak:0,right:0,missed:[],rem:1};
  run.stage=h('div',{class:'stage'});
  run.hE=h('span');run.xE=h('span');run.cE=h('span');
  run.bar=h('div',{class:'bar-f'});run.tt=h('span',{class:'tt'});
  run.dots=list.map(()=>h('span',{class:'dot'}));
  const hud=h('div',{class:'hud'},
    h('button',{class:'btn sm',onclick:()=>{if(confirm('Sair da fase? O progresso desta tentativa será perdido.')){stopTimer();showMap();}}},'← Mapa'),
    h('div',{class:'who'},h('b',{},S.name+(S.turma?' · '+S.turma:'')),h('span',{},ph.icon+' '+ph.title+' · Nível: '+level(totalXP()).name)),
    h('div',{class:'hud-r'},run.hE,run.xE,run.cE));
  mount('Missão Desktop.exe — '+ph.title,h('div',{},hud,h('div',{class:'dots'},run.dots),run.stage));
  updHud();nextChallenge();
}
function updHud(){
  run.hE.textContent='❤️'.repeat(Math.max(0,run.hearts))+'🖤'.repeat(3-Math.max(0,run.hearts));
  run.xE.textContent='⭐ '+run.xp+' XP';
  run.cE.textContent=run.streak>=2?'🔥 x'+run.streak:'';
}
function nextChallenge(){
  const i=run.i;const r=rng(run.seed+i*7919+13);
  const ch=run.list[i](r,run.ctx);
  const box=h('div',{class:'chbox'});const fbHost=h('div');
  run.cur={ch,box,fbHost,answered:false};
  run.dots.forEach((d,k)=>{if(k===i)d.classList.add('now');else d.classList.remove('now');});
  run.stage.replaceChildren(
    h('div',{class:'kind px'},(run.total>1?(i+1)+'/'+run.total+' · ':'')+KIND[ch.kind]),
    h('div',{class:'prompt',html:ch.prompt}),
    h('div',{class:'timer'},h('div',{class:'bar'},run.bar),run.tt),
    box,fbHost);
  ch.mount(box,(ok,extra)=>answer(ok,extra));
  startTimer(ch.time*(run.ph.boss?0.8:1));
}
function startTimer(sec){
  stopTimer();run.t0=Date.now();run.dur=sec*1000;run.rem=1;
  const tick=()=>{
    const rem=Math.max(0,run.dur-(Date.now()-run.t0));
    run.rem=rem/run.dur;run.bar.style.width=(run.rem*100)+'%';
    run.bar.classList.toggle('low',run.rem<.25);run.tt.textContent=Math.ceil(rem/1000)+'s';
    if(rem<=0){answer(false,null,true);}
  };
  tick();tmr=setInterval(tick,200);
}
function answer(ok,extra,timeout){
  const cur=run&&run.cur;if(!cur||cur.answered)return;
  cur.answered=true;stopTimer();cur.box.classList.add('frozen');
  let gain=0;S.stats.answered++;
  if(ok){
    run.streak++;run.right++;S.stats.correct++;S.stats.maxStreak=Math.max(S.stats.maxStreak,run.streak);
    gain=100+Math.round(50*run.rem)+Math.min(run.streak-1,5)*10;run.xp+=gain;sfx('ok');
  }else{run.streak=0;run.hearts--;run.missed.push(cur.ch.explain);sfx('bad');}
  persist();updHud();
  run.dots[run.i].className='dot '+(ok?'ok':'bad');
  const last=run.i+1>=run.total;
  const fb=h('div',{class:'fb '+(ok?'ok':'bad')},
    h('div',{class:'fb-h'},ok?'✅ Correto! +'+gain+' XP':(timeout?'⏰ Tempo esgotado':'❌ Não foi dessa vez (−1 vida)')),
    h('div',{class:'fb-b',html:extra||cur.ch.explain}),
    h('button',{class:'btn primary',onclick:()=>{if(cur.segue)return;cur.segue=true;run.i++;if(run.hearts<=0)return showResult(false);if(last)return showResult(true);nextChallenge();}},
      run.hearts<=0?'Ver resultado':(last?'Finalizar fase':'Continuar ▶')));
  cur.fbHost.append(fb);
  try{fb.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
}
function showResult(success){
  stopTimer();const ph=run.ph;const stars=Math.max(0,run.hearts);
  let extra='';
  if(success){
    const prev=S.phases[ph.id]||{stars:0,xp:0};
    S.phases[ph.id]={done:true,stars:Math.max(prev.stars,stars),xp:Math.max(prev.xp,run.xp)};persist();
    confetti();
    extra='Melhor pontuação da fase: '+S.phases[ph.id].xp+' XP · '+'★'.repeat(S.phases[ph.id].stars)+'☆'.repeat(3-S.phases[ph.id].stars);
  }
  const missed=run.missed;
  mount('Missão Desktop.exe — Resultado',h('div',{},
    h('h1',{style:'font-size:30px'},success?'Fase concluída! 🎉':'Sem vidas 💔'),
    h('p',{},success?ph.icon+' Medalha: '+ph.badge:'Revise os pontos abaixo e tente de novo. As questões mudam a cada tentativa.'),
    h('div',{class:'stars',style:'font-size:34px'},success?'★'.repeat(stars)+'☆'.repeat(3-stars):'☆☆☆'),
    h('p',{},'Acertos: '+run.right+' de '+run.total+' · XP desta rodada: '+run.xp),
    extra?h('p',{class:'small'},extra):null,
    missed.length?h('div',{class:'review'},h('b',{},'📖 Para revisar na apostila:'),h('ul',{},missed.map(m=>h('li',{html:m})))):null,
    h('div',{class:'actions'},
      h('button',{class:'btn primary',onclick:showMap},'Voltar ao mapa'),
      h('button',{class:'btn',onclick:()=>play(ph.id)},'Jogar de novo (questões novas)'),
      h('button',{class:'btn warn',onclick:showCard},'📸 Cartão de progresso'))));
}

/* ---- cartão de progresso (para print) ---- */
function fmtTime(s){const m=Math.floor(s/60);return m+'min '+String(s%60).padStart(2,'0')+'s';}
function showCard(){
  stopTimer();
  const tx=totalXP(),lv=level(tx),nph=doneCount(),lv2=S.stats.leaves;
  const acc=S.stats.answered?Math.round(S.stats.correct/S.stats.answered*100):0;
  const code=verCode(S.name,tx,nph,lv2);
  const bl=badgesList();
  const rows=PH.map(p=>{const st=S.phases[p.id];return h('tr',{},h('td',{},p.icon+' '+p.title.replace(/^Fase \d · /,'')),h('td',{},st&&st.done?'★'.repeat(st.stars)+'☆'.repeat(3-st.stars):'—'),h('td',{},st&&st.done?st.xp:'—'),h('td',{},S.attempts[p.id]||0));});
  const summary='Missão Desktop (Aula 03) — '+S.name+(S.turma?' ('+S.turma+')':'')+' | Meta: '+metaTxt()+' | Nível: '+lv.name+' | XP: '+tx+' | Fases: '+nph+'/'+PH.length+' | Acertos: '+acc+'% | Saídas da página: '+lv2+' | Código: '+code;
  mount('Missão Desktop.exe — Cartão de progresso',h('div',{},
    h('div',{class:'cardp'},
      h('div',{class:'small'},'Sistemas Operacionais · Aula 03 · Área de Trabalho e Aplicativos'),
      h('h2',{},S.name),
      h('div',{class:'small'},(S.turma?'Turma: '+S.turma+' · ':'')+new Date().toLocaleString('pt-BR')),
      h('div',{class:'crow'},
        h('div',{class:'stat'},'Nível',h('b',{},lv.name)),
        h('div',{class:'stat'},'XP total',h('b',{},tx)),
        h('div',{class:'stat'},'Meta da aula',h('b',{style:'font-size:17px'},metaTxt())),
        h('div',{class:'stat'},'Fases concluídas',h('b',{},nph+' / '+PH.length)),
        h('div',{class:'stat'},'Acertos',h('b',{},acc+'%')),
        h('div',{class:'stat'},'Tempo de jogo',h('b',{style:'font-size:17px'},fmtTime(S.stats.seconds))),
        h('div',{class:'stat'},'Saídas da página',h('b',{},lv2))),
      h('table',{class:'ptab'},h('thead',{},h('tr',{},h('th',{},'Fase'),h('th',{},'Estrelas'),h('th',{},'Melhor XP'),h('th',{},'Tent.'))),h('tbody',{},rows)),
      h('div',{class:'badges'},bl.length?bl.map(x=>h('span',{class:'badge'},x.i+' '+x.t)):h('span',{class:'small'},'Sem medalhas ainda')),
      h('div',{style:'margin-top:8px'},h('span',{class:'small'},'Código de verificação: '),h('span',{class:'code'},code))),
    h('p',{class:'small noprint'},'Tire um print desta tela inteira (Print Screen ou Recortes) e envie ao professor.'),
    h('div',{class:'actions noprint'},
      h('button',{class:'btn primary',onclick:showMap},'← Voltar ao mapa'),
      h('button',{class:'btn',onclick:e=>{try{navigator.clipboard.writeText(summary);e.target.textContent='Copiado ✔';}catch(_){e.target.textContent='Não foi possível copiar';}}},'Copiar resumo em texto'))));
}

/* ---- área do professor: confere o cartão ---- */
function h53(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
const SENHA_PROF='8570079599154905';
function libBox(){
  if(!(S&&S.name))return null;
  if(S.liberarTudo)return h('div',{class:'prompt'},'🔓 Todas as fases (inclusive o Chefão) estão liberadas neste aparelho. ',
    h('button',{class:'btn sm',onclick:()=>{S.liberarTudo=false;persist();showProf();}},'Bloquear de novo'));
  const pw=h('input',{type:'password',id:'pw',autocomplete:'off',placeholder:'Senha do professor'});
  const err=h('div',{class:'small',style:'color:#945700;min-height:20px'});
  const go=()=>{if(String(h53(pw.value))===SENHA_PROF){S.liberarTudo=true;persist();showMap();}else{err.textContent='Senha incorreta.';pw.value='';pw.focus();}};
  pw.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  return h('div',{class:'prompt'},h('b',{},'🔒 Liberar todas as fases'),h('p',{class:'small'},'Libera o Chefão neste aparelho sem precisar concluir 5 fases.'),
    h('div',{class:'field'},pw),err,h('div',{class:'actions'},h('button',{class:'btn primary',onclick:go},'Liberar')));
}
function showProf(){
  const f=(l,id,ph)=>h('div',{class:'field'},h('label',{for:id},l),h('input',{type:'text',id,placeholder:ph||''}));
  const out=h('div',{class:'prompt'});
  const chk=()=>{
    const g=id=>document.getElementById(id).value.trim();
    const c=verCode(g('pn'),parseInt(g('px'),10)||0,parseInt(g('pf'),10)||0,parseInt(g('ps'),10)||0);
    const typed=g('pc').toUpperCase();
    out.textContent=typed===c?'✅ Código confere: o cartão é autêntico.':'❌ Código NÃO confere. Esperado para esses dados: '+c;
  };
  mount('Área do professor',h('div',{},
    libBox(),
    h('p',{},'Digite os dados exatamente como aparecem no print do aluno e o código de verificação. O nome deve estar igual ao do cartão.'),
    f('Nome do aluno','pn'),f('XP total','px'),f('Fases concluídas (só o primeiro número, ex.: 6)','pf'),f('Saídas da página','ps'),f('Código (ex.: AB12-CDE)','pc'),
    h('div',{class:'actions'},h('button',{class:'btn primary',onclick:chk},'Conferir'),h('button',{class:'btn',onclick:()=>S&&S.name?showMap():showLogin()},'Voltar')),out,
    h('p',{class:'small'},'Dica: o código depende do texto SALT no início do script. Troque por algo só seu antes de publicar e não altere depois, ou os códigos antigos deixam de conferir.')));
}

/* ---- início ---- */
if(S&&S.name)showMap();else showLogin();
})();
</script>
