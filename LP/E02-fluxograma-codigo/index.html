<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#274a9c">
<title>Do fluxograma ao código</title>
<meta name="description" content="Treino interativo: ligar o fluxograma ao código em Portugol e Java, arrastar figuras, completar o código, executar o fluxograma e testar no Portugol Web Studio e no OneCompiler.">
<style>
:root{
  --bg:#e7edf2; --surface:#ffffff; --surface-2:#f3f7fa;
  --ink:#0f2230; --ink-2:#4a6478; --line:#c6d4de;
  --primary:#15697f; --primary-d:#0e4c5d; --primary-l:#d8ecf1;
  --ok:#1f8a4c; --ok-d:#166b3a; --ok-l:#dcf3e5;
  --bad:#c23b4d; --bad-d:#982b3b; --bad-l:#fae1e4;
  --gold:#e0900a; --gold-l:#fdf0d4;
  --r:14px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1820; --surface:#132633; --surface-2:#0f202b; --ink:#e8f1f6; --ink-2:#9fb6c4;
    --line:#26404f; --primary:#3aa8c4; --primary-d:#2b8299; --primary-l:#123542;
    --ok:#3fbf75; --ok-d:#2c8f56; --ok-l:#102e20; --bad:#f0697c; --bad-d:#b84656; --bad-l:#33161c;
    --gold:#f4b73f; --gold-l:#332611;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI Variable Text","Segoe UI",Roboto,Ubuntu,system-ui,-apple-system,"Helvetica Neue",sans-serif;
  font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.shell{max-width:560px;margin:0 auto;min-height:100%;padding:0 14px 40px}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -14px 14px;
  padding:10px 14px;background:var(--surface);border-bottom:3px solid var(--primary);
  display:flex;align-items:center;gap:10px;
}
.topbar .grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;
  padding:4px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.pill.xp{color:var(--gold);border-color:var(--gold)}
.pill.hp{color:var(--hp);border-color:var(--hp)}
.bar{height:12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--primary);transition:width .35s ease}
.iconbtn{background:none;border:0;padding:6px;border-radius:9px;cursor:pointer;color:var(--ink-2);font-size:20px;line-height:1}
.iconbtn:hover{background:var(--surface-2)}

h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:.2em 0 .3em;font-weight:700}
h2{font-size:21px;line-height:1.2;letter-spacing:-.01em;margin:0 0 .4em;font-weight:700}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
p{margin:0 0 .8em}
.sub{color:var(--ink-2);font-size:15px}

.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.btn{
  display:block;width:100%;padding:14px 16px;border-radius:var(--r);border:0;
  background:var(--primary);color:#fff;font-weight:700;font-size:17px;cursor:pointer;
  box-shadow:0 4px 0 var(--primary-d);margin-bottom:12px;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--primary-d)}
.btn[disabled]{background:var(--line);color:var(--ink-2);box-shadow:0 4px 0 var(--line);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--primary);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 var(--ok-d)}
.btn.small{padding:10px 12px;font-size:15px}
.row{display:flex;gap:10px}
.row > *{flex:1}
input[type=text]{
  width:100%;padding:13px 14px;border-radius:var(--r);border:2px solid var(--line);
  background:var(--surface-2);color:var(--ink);font-size:17px;font-family:inherit;
}
input[type=text]:focus{border-color:var(--primary);outline:none}
label.f{display:block;font-weight:600;font-size:14px;margin:0 0 5px}

/* ---------- boot ---------- */
.boot{border:2px solid var(--line);border-radius:var(--r);overflow:hidden;background:#0a1620;margin-bottom:16px}
.boot .screen{aspect-ratio:16/9;position:relative;background:
  radial-gradient(120% 90% at 70% 15%,var(--boot1) 0%,var(--boot2) 55%,var(--boot3) 100%);}
.boot .bootline{position:absolute;left:16px;top:16px;color:var(--bootfg);font-size:12px;opacity:0}
.boot .lg{position:absolute;inset:0;display:grid;place-items:center;opacity:0;padding:0 20px;text-align:center}
.boot .lg b{color:#eaf6fb;font-size:clamp(18px,5.6vw,27px);letter-spacing:-.02em;line-height:1.25}
.boot .cursor{display:inline-block;width:9px;height:1.1em;background:var(--bootfg);vertical-align:-2px;margin-left:2px;
  animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
@keyframes fadein{to{opacity:1}}
.boot .bootline{animation:fadein .01s .15s forwards}
.boot .lg{animation:fadein .7s .5s forwards}

/* ---------- mapa de níveis ---------- */
.trail{display:flex;flex-direction:column;gap:10px}
.node{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px;
  box-shadow:0 3px 0 var(--line);
}
.node:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.node[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.node .glyph{width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:var(--primary-l);
  display:grid;place-items:center;font-size:23px;border:2px solid var(--line)}
.node.done .glyph{background:var(--ok-l);border-color:var(--ok)}
.node.boss .glyph{background:var(--gold-l);border-color:var(--gold)}
.node .t{flex:1;min-width:0}
.node .t b{display:block;font-size:16px}
.node .t span{font-size:13px;color:var(--ink-2)}
.stars{letter-spacing:1px;font-size:14px;color:var(--gold)}
.stars .off{color:var(--line)}

/* ---------- cena de código ---------- */
.scene{user-select:none;-webkit-user-select:none;border-radius:10px;overflow:hidden;margin-bottom:12px}
.scene.code{background:#0d1b24;color:#d7e6ee;font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;
  padding:14px 10px;line-height:1.85;font-size:13.5px;border:2px solid var(--line);overflow-x:auto}
.scene.code .cline{display:flex;gap:10px;white-space:pre;padding:1px 4px;border-radius:6px}
.scene.code .cno{width:18px;flex:0 0 18px;text-align:right;color:#4f7186;user-select:none}
.scene.code .ccode{white-space:pre-wrap;word-break:break-word}
.scene.code .cplain{color:#c7dbe6}
.scene.code .ctok{cursor:pointer;border-radius:4px;padding:1px 2px;border-bottom:2px dotted var(--tok)}
.scene.code .ctok:hover,.scene.code .ctok:active{background:var(--tokbg)}
.zone-hit{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- respostas ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{
  background:var(--surface);border:2px solid var(--line);border-radius:11px;padding:10px 13px;
  font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 3px 0 var(--line);
}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chip.sel{background:var(--primary-l);border-color:var(--primary);color:var(--primary-d)}
.chip.used{opacity:.25;pointer-events:none}
.tray{min-height:54px;border:2px dashed var(--line);border-radius:11px;padding:8px;display:flex;
  flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;background:var(--surface-2)}
.tray:empty::after{content:"Toque nas peças abaixo para montar a resposta";color:var(--ink-2);font-size:13px}
.opt{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;margin-bottom:10px;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:13px;
  box-shadow:0 3px 0 var(--line);font-size:16px;
}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.opt.sel{background:var(--primary-l);border-color:var(--primary)}
.opt .mark{width:22px;height:22px;flex:0 0 22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}
.opt.sel .mark{background:var(--primary);border-color:var(--primary);color:#fff}
.slots{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.slotrow{display:flex;align-items:center;gap:9px}
.slotrow .nm{flex:0 0 42%;font-weight:700;font-size:13.5px}
.slot{flex:1;min-height:46px;border:2px dashed var(--line);border-radius:11px;background:var(--surface-2);
  display:flex;align-items:center;padding:6px 9px;font-size:14px;font-weight:600;cursor:pointer}
.slot.full{border-style:solid;background:var(--primary-l);border-color:var(--primary)}

/* ---------- feedback ---------- */
.feed{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));
  border-top:3px solid;background:var(--surface)}
.feed.good{background:var(--ok-l);border-color:var(--ok)}
.feed.bad{background:var(--bad-l);border-color:var(--bad)}
.feed .inner{max-width:560px;margin:0 auto}
.feed b{display:block;font-size:17px;margin-bottom:3px}
.feed.good b{color:var(--ok-d)}.feed.bad b{color:var(--bad-d)}
.feed p{font-size:15px;margin:0 0 10px}
.feed .btn{margin:0}
.spacer{height:150px}
.travado #app{pointer-events:none}
.scene.code{margin:0 0 12px}

/* ---------- relatório ---------- */
.skill{margin-bottom:12px}
.skill .hd{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:4px}
.skill .hd i{font-style:normal;color:var(--ink-2)}
.code{font-family:ui-monospace,Consolas,monospace;font-size:20px;letter-spacing:.14em;font-weight:700;color:var(--primary)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}
.kv b{font-weight:700}
.medal{display:flex;align-items:center;gap:12px;background:var(--gold-l);border:2px solid var(--gold);border-radius:var(--r);padding:12px;margin-bottom:14px}
.medal .m{font-size:34px}
.warn{background:var(--gold-l);border:2px solid var(--gold);border-radius:var(--r);padding:11px;font-size:14px;margin-bottom:14px}
.note{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:11px;font-size:14px;color:var(--ink-2)}
.theory li{margin-bottom:7px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.timer.low{color:var(--bad)}
canvas{max-width:100%;height:auto;border:2px solid var(--line);border-radius:var(--r)}

.pwrow{display:flex;gap:10px;margin-top:10px}
.pwrow input{flex:1}
.pwerr{color:var(--bad-d,#b3261e);font-size:14px;min-height:20px;margin-top:6px}

.secao{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin:16px 4px 6px}
.metabox{background:var(--gold-l);border:1.5px solid var(--gold);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:15px}

.topbar.col{flex-direction:column;align-items:stretch;gap:8px}
.topbar .trow{display:flex;align-items:center;gap:10px}
.topbar .info{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.topbar .info b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .info span{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rodape{max-width:560px;margin:8px auto 0;padding:14px 14px calc(22px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line)}

/* ---------- fluxograma ---------- */
:root{--fshape:#bbdefb;--fink:#1b2733}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fshape:#1f5384;--fink:#e5ecf4}}
.flowbox{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:8px 6px;margin:0 0 12px;text-align:center}
.flow{display:block;width:100%;height:auto;margin:0 auto;color:var(--fink);-webkit-user-select:none;user-select:none}
.fsh{fill:var(--fshape);stroke:var(--fink);stroke-width:2;stroke-linejoin:round}
.fhole{fill:var(--surface-2);stroke-dasharray:6 4}
.fhole2{stroke-dasharray:6 4;stroke:var(--primary);stroke-width:3}
.far{fill:none;stroke:var(--fink);stroke-width:2}
.ftx{fill:var(--fink);font-family:inherit;font-weight:600}
.ftx.fb{font-weight:700}
.flab{fill:var(--fink);font-family:inherit;font-weight:700}
.fz{cursor:pointer}
.fz:active .fsh{filter:brightness(.9)}
.fmini{display:block;height:auto;margin:0 auto;color:var(--fink)}
.figstem{display:flex;justify-content:center;padding:4px 0 14px}
.figstem .fmini{max-width:190px;width:100%}
.figopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.figopt{margin:0;justify-content:center;padding:12px 6px}
.legrow{display:flex;align-items:center;gap:12px;margin:8px 0}
.legrow .fmini{flex:0 0 146px;width:146px}
.legrow span{font-size:14.5px;line-height:1.3}
details.legdet{margin:0 0 12px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:8px 12px}
details.legdet summary{cursor:pointer;font-weight:600;font-size:15px;color:var(--primary-d)}
.figbank{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.fchip{background:var(--surface);border:2px solid var(--line);border-radius:11px;padding:4px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.fchip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.fchip.used{opacity:.25;pointer-events:none}
.flowtray{flex-direction:column;align-items:center;gap:0;padding:8px}
.flowtray .fchip{width:min(100%,190px);border-style:solid;border-color:var(--primary);background:var(--primary-l);box-shadow:none}
.flowtray .dn{color:var(--ink-2);line-height:1;font-size:18px;height:18px}
.slotrow .nm svg{max-width:124px}
.scene.code .ccode{tab-size:3}
.cgrp .scene.code{font-size:11px;letter-spacing:0;padding:10px 8px}
.cgrp .scene.code .cline{gap:6px}
.cgrp{margin:6px 0 14px}
.chead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.chead .fmini{flex:0 0 112px;width:112px;margin:0}
.chead b{font-size:15px}
.crow{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px dashed var(--line)}
.crow .cl{flex:0 0 62px;font-size:11px;font-weight:700;color:var(--primary-d);text-transform:uppercase;letter-spacing:.03em}
.crow code{font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.cnote{font-size:13px;line-height:1.35;color:var(--ink-2);margin:4px 0 0}

/* ---------- aula 2: arrastar, completar, executar, missao ---------- */
.flowbox.bare{border:0;background:transparent;padding:0;margin:0}
.flopt{display:block;width:100%;padding:8px 10px 6px;text-align:center;position:relative;margin:0 0 10px}
.flopt .fl-l{position:absolute;left:8px;top:6px;font-weight:700;font-size:13px;color:var(--primary-d);background:var(--primary-l);border-radius:8px;padding:1px 9px}
.fcur .fsh{stroke:var(--primary);stroke-width:4.5}
.shapebank,.wordbank{margin:6px 0 14px}
.shapebank{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shapebank.c5{grid-template-columns:repeat(5,1fr)}
.shapebank .fchip{padding:7px 4px}
.shapebank .fchip.sel{border-color:var(--primary);background:var(--primary-l)}
.wordbank{display:flex;flex-wrap:wrap;gap:8px}
.wordbank .chip{margin:0}
.arrasto{position:fixed;z-index:80;pointer-events:none;opacity:.94;transform:scale(1.08);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.fchip.lift,.chip.lift{opacity:.35}
body.arrastando,body.arrastando *{-webkit-user-select:none;user-select:none}
.fz.alvo-hover .fsh{stroke:var(--primary);stroke-width:4.5}
.blank{display:inline-block;min-width:48px;text-align:center;border-bottom:2px dashed #7fb2cf;background:rgba(127,178,207,.2);border-radius:4px;padding:0 6px;color:#9fc6dc;cursor:pointer}
.blank.full{border-bottom-style:solid;color:#ffd479;background:rgba(255,212,121,.12)}
.blank.alvo-hover{outline:2px solid #7fb2cf}
.scene.code .ccode{tab-size:3}
.expanel{position:sticky;bottom:0;z-index:5;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-top:10px;box-shadow:0 -4px 14px rgba(0,0,0,.1)}
.extab{border-collapse:collapse;margin:0 0 6px}
.extab th,.extab td{border:1.5px solid var(--line);padding:1px 12px;text-align:center;font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;font-size:14px}
.extab th{background:var(--primary-l);color:var(--primary-d)}
.extela{background:#0d1b24;color:#d7e6ee;font-family:ui-monospace,Consolas,"DejaVu Sans Mono",monospace;border-radius:8px;padding:5px 10px;min-height:26px;white-space:pre-wrap;font-size:13px;margin:0 0 8px}
.exmsg{font-weight:600;margin:0 0 8px;font-size:15px;line-height:1.35}
.exbtns{display:flex;gap:8px;flex-wrap:wrap}
.exbtns .btn{margin:0;width:auto;flex:1 1 90px;padding:10px 12px}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.missao{display:block}
.mtool{display:block;text-decoration:none;text-align:center;margin:0 0 10px}
.mtest{background:var(--surface);border:2px solid var(--gold);border-radius:var(--r);padding:8px 12px;margin:0 0 10px;font-size:15px;line-height:1.4;color:var(--ink)}
.mtest b{font-family:ui-monospace,Consolas,monospace}
.mcode{margin:0 0 10px}
.mcode summary{cursor:pointer;font-weight:600;font-size:15px;color:var(--primary-d);margin-bottom:6px}
.mpass{margin:0 0 10px;padding-left:20px;font-size:15px}
.mpass li{margin-bottom:3px}
/* TEMA-INI */
:root{--bg:#e8ecf6;--surface-2:#f2f5fb;--line:#c5cfe8;--primary:#274a9c;--primary-d:#1c3777;--primary-l:#e3e9f7;
  --boot1:#2f56b3;--boot2:#14285a;--boot3:#0a1330;--bootfg:#b5c8f5;--tok:#6f93e8;--tokbg:rgba(111,147,232,.25);--hp:#c23b4d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1226;--surface:#121c38;--surface-2:#0e1730;--ink:#e8eef9;--ink-2:#a3b2d3;--line:#25355e;
  --primary:#4a72d6;--primary-d:#3558ad;--primary-l:#14264f;--hp:#f0697c}}
/* TEMA-FIM */
</style>
</head>
<body>
<div class="shell" id="app"></div>
<footer class="rodape">Rosival Silva · 2026</footer>

<script>
"use strict";
/* ============================================================
   Lógica de Programação — Aula Extra 2: Do fluxograma ao código
   Treino gamificado. Rosival Silva.
   ============================================================ */

var STORE = "lp_e02_v1";

function sFluxo(sp,op){
  op=op||{};

    N[o.id]=o;ext(o.x-o.w/2,o.y-o.hh/2);ext(o.x+o.w/2,o.y+o.hh/2);
  });
  function A(o,s){return s==="t"?[o.x,o.y-o.hh/2]:s==="b"?[o.x,o.y+o.hh/2]:s==="l"?[o.x-o.w/2,o.y]:[o.x+o.w/2,o.y];}
  var edges="",labels="";

    if(rt==="v"){P=[A(a,"b"),A(b,"t")];}
    else if(rt==="z"){s0=A(a,"b");s1=A(b,"t");X=(s0[1]+s1[1])/2;P=[s0,[s0[0],X],[s1[0],X],s1];}
    else if(rt==="rz"){s0=A(a,"r");s1=A(b,"t");P=[s0,[s1[0],s0[1]],s1];}
    else if(rt==="lz"){s0=A(a,"l");s1=A(b,"t");P=[s0,[s1[0],s0[1]],s1];}
    else if(rt==="loopL"){s0=A(a,"l");s1=A(b,"l");X=Math.min(s0[0],s1[0])-26;P=[s0,[X,s0[1]],[X,s1[1]],s1];}
    else{s0=A(a,"r");s1=A(b,"r");X=Math.max(s0[0],s1[0])+26;P=[s0,[X,s0[1]],[X,s1[1]],s1];}
    P.forEach(function(p){ext(p[0],p[1]);});

      else{lx=m0[0]+9;ly=m0[1]+18;}

      ext(an==="end"?lx-30:lx+32,ly);
    }
  });
  var body="";
  sp.n.forEach(function(d){
    var o=N[d.i],g;
    if(o.h==="f")g=fshape("proc",o.x,o.y,o.w,o.hh,"fsh fhole")+ftxt(o.t,o.x,o.y,"proc");
    else if(o.h==="t")g=fshape(o.k,o.x,o.y,o.w,o.hh,"fsh fhole2")+ftxt("?",o.x,o.y,o.k,true);
    else g=fshape(o.k,o.x,o.y,o.w,o.hh)+ftxt(o.t,o.x,o.y,o.k,o.k==="inicio"||o.k==="fim");
    body+=op.zonas?'<g class="fz'+(op.cur===o.id?' fcur':'')+'" data-zone="'+o.id+'">'+g+'</g>':'<g'+(op.cur===o.id?' class="fcur"':'')+'>'+g+'</g>';
  });
  var W=maxX-minX+28,H=maxY-minY+28;
  return '<div class="flowbox'+(op.bare?' bare':'')+'"><svg class="flow" viewBox="'+(minX-14)+' '+(minY-14)+' '+W+' '+H+'" style="max-width:'+(op.max?Math.min(op.max,Math.round(W*1.2)):Math.round(W*1.2))+'px" role="img" aria-label="Fluxograma">'+
    '<defs><marker id="'+id+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></marker></defs>'+
    edges+body+labels+'</svg></div>';
}

/* ---------- cena de código ---------- */
function codeRow(n, raw){
  var re=/\[\[([^|]+)\|([^\]]+)\]\]/g;
  var out="",last=0,m;
  while((m=re.exec(raw))){
    out+= raw.slice(last,m.index).length? '<span class="cplain">'+esc(raw.slice(last,m.index))+'</span>':'';
    out+= '<span class="ctok" data-zone="'+m[1]+'">'+esc(m[2])+'</span>';
    last=re.lastIndex;
  }
  var rest=raw.slice(last);
  if(rest.length)out+= '<span class="cplain">'+esc(rest)+'</span>';
  return '<div class="cline"><span class="cno">'+(n!=null?n:'')+'</span><span class="ccode">'+out+'</span></div>';
}
function sCode(rows){
  return '<div class="scene code">'+rows.map(function(l,i){
    if(Array.isArray(l))return codeRow(l[0],l[1]);
    return codeRow(i+1,l);
  }).join('')+'</div>';
}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function norm(s){return String(s).toLowerCase().replace(/,/g,".").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9. ]/g," ").replace(/\s+/g," ").trim();}
function limpaResp(v){

function h53(str){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}

function iniciarNivel(lv){
  limparVistos(lv);
  jogo={lv:lv,fila:shuffle(lv.qs),idx:0,vidas:(lv.hearts||5),total:lv.qs.length,
        acertosPrimeira:0,respondidas:0,hab:{},tempoIni:Date.now()};
  proxima();
}
function regHab(q,acertou){
  var s=q.skill||jogo.lv.skill;
  if(!jogo.hab[s])jogo.hab[s]={c:0,t:0};
  jogo.hab[s].t++;if(acertou)jogo.hab[s].c++;
}
function proxima(){
  if(jogo.idx>=jogo.fila.length){fimNivel(true);return;}
  render(jogo.fila[jogo.idx]);
}

var cron=null;
function render(q){
  if(cron){clearInterval(cron);cron=null;}
  var lv=jogo.lv;
  jogo.travado=false;document.body.classList.remove("travado");
  var velho=document.querySelector(".feed");if(velho)velho.remove();
  var prog=Math.round(jogo.respondidas/jogo.total*100);
  var vidas="";for(var i=0;i<jogo.vidas;i++)vidas+="♥";
  var h=topoJogo('<div class="trow"><button class="iconbtn" id="sair">✕</button>'+
     '<div class="grow info">'+infoJogador(lv)+'</div>'+
     (lv.timer?'<span class="pill timer" id="cron">'+lv.timer+'s</span>':'')+
     '<span class="pill hp">'+vidas+'</span></div>'+
     '<div class="bar"><i style="width:'+Math.min(100,prog)+'%"></i></div>');

  h+='<h2 style="margin-bottom:12px">'+esc(q.p)+'</h2>';
  if(q.k)h+='<div class="figstem">'+miniForma(q.k,q.kt||"",190)+'</div>';
  if(q.fluxo&&q.t!=="hotf")h+=sFluxo(q.fluxo);
  if(q.rows&&q.t!=="hot")h+=sCode(q.rows);
  if(lv.legenda)h+='<details class="legdet"><summary>Ver legenda das figuras</summary>'+legenda()+'</details>';
  if(lv.cola)h+='<details class="legdet"><summary>Ver a cola das 3 linguagens</summary>'+cola(lv.cola)+'</details>';
  h+='<div id="area"></div>';
  h+='<div id="acao"></div><div class="spacer"></div>';
  app.innerHTML=h;
  $("#sair").onclick=function(){ if(confirm("Sair do nível? O que você fez agora não conta.")){ if(cron)clearInterval(cron); telaMapa(); } };

  var area=$("#area"),acao=$("#acao");
  RENDER[q.t](q,area,acao);

  if(lv.timer){
    var t=lv.timer,c=$("#cron");
    cron=setInterval(function(){
      t--;if(c){c.textContent=t+"s";if(t<=7)c.classList.add("low");}
      if(t<=0){clearInterval(cron);cron=null;julgar(q,false,"Tempo esgotado.");}
    },1000);
  }
  window.scrollTo(0,0);
}

function botaoConferir(acao,fn){
  var b=el('<button class="btn" disabled id="conf">Conferir</button>');
  acao.appendChild(b);b.onclick=fn;return b;
}
function ligarConferir(on){var b=$("#conf");if(b)b.disabled=!on;}

var RENDER={
  figura:function(q,area){
    var g=el('<div class="figopts"></div>');
    shuffleIdx(q).forEach(function(i){
      var b=el('<button class="opt figopt">'+miniForma(q.opts[i],q.txt||"")+'</button>');
      b.onclick=function(){julgar(q,i===q.ok);};
      g.appendChild(b);
    });
    area.appendChild(g);
  },
  hotf:function(q,area){
    area.innerHTML='<p class="sub">Toque na figura certa.</p>'+sFluxo(q.fluxo,{zonas:true});
    area.addEventListener("click",function(ev){
      var z=ev.target.closest("[data-zone]");if(!z)return;
      var ok=q.ok.indexOf(z.getAttribute("data-zone"))>=0;
      if(!ok){z.classList.add("zone-hit");setTimeout(function(){z.classList.remove("zone-hit");},320);}
      julgar(q,ok);

  montar:function(q,area,acao){
    area.appendChild(el('<p class="sub">Toque nas figuras na ordem do fluxograma, de cima para baixo. Toque de novo em cima para tirar.</p>'));
    var tray=el('<div class="tray flowtray" id="tray"></div>');area.appendChild(tray);
    var bank=el('<div class="figbank"></div>');area.appendChild(bank);
    var todos=q.items.map(function(it,i){return {i:i,k:it[0],t:it[1]};}).concat((q.extra||[]).map(function(it,j){return {i:100+j,k:it[0],t:it[1]};}));
    var montado=[];
    shuffle(todos).forEach(function(it){
      var b=el('<button class="fchip">'+miniForma(it.k,it.t)+'</button>');
      b.onclick=function(){
        if(b.classList.contains("used")||montado.length>=q.items.length)return;
        montado.push({it:it,btn:b});b.classList.add("used");pintar();
      };
      bank.appendChild(b);
    });
    function pintar(){
      tray.innerHTML="";
      montado.forEach(function(m,pos){
        var c=el('<button class="fchip">'+miniForma(m.it.k,m.it.t)+'</button>');
        c.onclick=function(){montado.splice(pos,1);m.btn.classList.remove("used");pintar();};
        tray.appendChild(c);
        if(pos<montado.length-1)tray.appendChild(el('<span class="dn">↓</span>'));

    }
    botaoConferir(acao,function(){
      var ok=montado.length===q.items.length&&montado.every(function(m,p){return m.it.i===p;});
      julgar(q,ok,ok?null:"A ordem certa é: "+q.items.map(function(it){return String(it[1]).replace("\n"," ");}).join(" → ")+".");
    });
  },
  hot:function(q,area){
    area.innerHTML=sCode(q.rows);
    area.insertBefore(el('<p class="sub">Toque no trecho certo do código.</p>'),area.firstChild);
    area.addEventListener("click",function(ev){
      var z=ev.target.closest("[data-zone]");if(!z)return;
      var ok=q.ok.indexOf(z.dataset.zone)>=0;
      if(!ok){z.classList.add("zone-hit");setTimeout(function(){z.classList.remove("zone-hit");},320);}
      julgar(q,ok);
    });
  },
  pick:function(q,area){
    shuffleIdx(q).forEach(function(i){
      var b=el('<button class="opt"><span class="mark"></span><span>'+esc(q.opts[i])+'</span></button>');
      b.onclick=function(){julgar(q,i===q.ok);};
      area.appendChild(b);
    });
  },
  multi:function(q,area,acao){
    var sel=[];
    shuffleIdx(q).forEach(function(i){
      var b=el('<button class="opt"><span class="mark">✓</span><span>'+esc(q.opts[i])+'</span></button>');
      b.onclick=function(){
        var p=sel.indexOf(i);
        if(p>=0){sel.splice(p,1);b.classList.remove("sel");}else{sel.push(i);b.classList.add("sel");}
        ligarConferir(sel.length===q.ok.length);
      };
      area.appendChild(b);
    });
    botaoConferir(acao,function(){
      var ok=sel.length===q.ok.length&&sel.every(function(i){return q.ok.indexOf(i)>=0;});
      julgar(q,ok);
    });
  },
  type:function(q,area,acao){
    area.appendChild(el('<input type="text" id="resp" autocomplete="off" autocapitalize="none" placeholder="Escreva a resposta">'));

    var inp=$("#resp");
    inp.addEventListener("input",function(){ligarConferir(inp.value.trim().length>0);});
    inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&inp.value.trim()){var b=$("#conf");if(b)b.click();}});
    botaoConferir(acao,function(){
      var v=norm(inp.value);
      var ok=q.ac.some(function(a){return norm(a)===v||norm(a)===limpaResp(v)||limpaResp(a)===limpaResp(v);});
      julgar(q,ok,ok?null:"Resposta esperada: "+q.ac[0]);
    });

  },
  order:function(q,area,acao){
    area.appendChild(el('<p class="sub">Toque na ordem certa. Toque de novo em cima para tirar.</p>'));

    var bank=el('<div class="chips"></div>');area.appendChild(bank);

        c.onclick=function(){ montado.splice(pos,1); m.btn.classList.remove("used"); pintarTray(); };

      ligarConferir(montado.length===q.items.length);
    }
    botaoConferir(acao,function(){
      var vals=montado.map(function(m){return m.text;});
      var ok=vals.length===q.items.length&&vals.every(function(v,i){return v===q.items[i];});
      julgar(q,ok,ok?null:"A ordem certa é: "+q.items.join(q.mono?"  ":" → "));
    });
  },
  slots:function(q,area,acao){
    area.appendChild(el('<p class="sub">'+(q.fig?"Toque num nome e depois na figura certa.":"Toque numa resposta e depois no espaço certo.")+'</p>'));
    var wrap=el('<div class="slots"></div>');
    var bank=el('<div class="chips"></div>');
    var sel=null,posto={};
    q.pairs.forEach(function(pr,i){
      var row=el('<div class="slotrow"><span class="nm">'+(q.fig?miniForma(pr[0],""):esc(pr[0]))+'</span><span class="slot" data-i="'+i+'"></span></div>');
      wrap.appendChild(row);

    area.appendChild(wrap);area.appendChild(bank);

    shuffle(q.pairs.map(function(p){return p[1];})).forEach(function(v){
      var b=el('<button class="chip">'+esc(v)+'</button>');

      b.onclick=function(){
        if(sel===v){sel=null;b.classList.remove("sel");return;}

    Array.prototype.forEach.call(wrap.querySelectorAll(".slot"),function(sl){
      sl.onclick=function(){

        if(posto[i]){ bots[posto[i]].classList.remove("used"); delete posto[i]; sl.textContent="";sl.classList.remove("full"); }
        if(sel){ posto[i]=sel; sl.textContent=sel; sl.classList.add("full"); bots[sel].classList.add("used"); bots[sel].classList.remove("sel"); sel=null; }
        ligarConferir(Object.keys(posto).length===q.pairs.length);

    botaoConferir(acao,function(){
      var ok=q.pairs.every(function(pr,i){return posto[i]===pr[1];});
      julgar(q,ok,ok?null:"Confira as ligações na teoria do nível.");

/* ============ aula 2: ligar o fluxograma ao codigo ============ */
var NOMEF={entrada:"Entrada",saida:"Saída",proc:"Processamento",decisao:"Decisão",inicio:"Início / Fim",fim:"Início / Fim"};
function kn(k){return k==="fim"?"inicio":k;}
function temDecisao(sp){return sp.n.some(function(n){return n.k==="decisao";});}

/* arrastar OU tocar: o mesmo gesto serve para o celular e para o mouse */
function arrastavel(chip,dado,achaAlvo,aoSoltar,aoToque){
  chip.style.touchAction="none";
  chip.addEventListener("pointerdown",function(ev){
    if(ev.button>0||(jogo&&jogo.travado))return;
    var x0=ev.clientX,y0=ev.clientY,mov=false,ghost=null,hover=null;
    function limpa(){if(hover){hover.classList.remove("alvo-hover");hover=null;}}
    function mv(e){
      if(!mov&&Math.abs(e.clientX-x0)+Math.abs(e.clientY-y0)>10){
        mov=true;document.body.classList.add("arrastando");ghost=chip.cloneNode(true);ghost.classList.add("arrasto");
        ghost.style.width=chip.offsetWidth+"px";document.body.appendChild(ghost);chip.classList.add("lift");
      }
      if(mov){
        ghost.style.left=(e.clientX-chip.offsetWidth/2)+"px";ghost.style.top=(e.clientY-chip.offsetHeight-16)+"px";
        var a=achaAlvo(e.clientX,e.clientY);
        if(a!==hover){limpa();hover=a;if(a)a.classList.add("alvo-hover");}
        e.preventDefault();
      }
    }
    function solta(){
      chip.removeEventListener("pointermove",mv);chip.removeEventListener("pointerup",fim);chip.removeEventListener("pointercancel",cancela);
      try{chip.releasePointerCapture(ev.pointerId);}catch(x){}
      limpa();document.body.classList.remove("arrastando");
    }
    function fim(e){
      solta();
      if(mov){ghost.remove();chip.classList.remove("lift");aoSoltar(dado,achaAlvo(e.clientX,e.clientY));}
      else aoToque(dado,chip);
    }
    function cancela(){solta();if(ghost){ghost.remove();chip.classList.remove("lift");}}
    try{chip.setPointerCapture(ev.pointerId);}catch(x){}
    chip.addEventListener("pointermove",mv);chip.addEventListener("pointerup",fim);chip.addEventListener("pointercancel",cancela);
  });
}
function alvoEm(x,y){var e=document.elementFromPoint(x,y);return e?e.closest("[data-zone],[data-blank]"):null;}

/* ---- esqueleto: arraste a figura para o espaco ---- */
RENDER.esq=function(q,area,acao){
  var colocado={},sel=null,kinds=q.bank||["entrada","saida","proc","decisao"];
  var box=el('<div id="esqflow"></div>');area.appendChild(box);
  area.appendChild(el('<p class="sub">Toque numa figura e depois no espaço, ou arraste a figura até ele. Toque numa figura colocada para tirar.</p>'));
  var bank=el('<div class="shapebank'+(kinds.length>4?' c5':'')+'"></div>');area.appendChild(bank);
  function ehBuraco(id){return q.holes.indexOf(id)>=0;}
  function desenha(){
    var sp=JSON.parse(JSON.stringify(q.fx));
    sp.n.forEach(function(n){
      if(!ehBuraco(n.i))return;
      if(colocado[n.i])n.k=colocado[n.i];else{n.k="proc";n.h="f";}
    });
    box.innerHTML=sFluxo(sp,{zonas:true});
    ligarConferir(Object.keys(colocado).length===q.holes.length);
  }
  function ponha(id,k){
    if(!ehBuraco(id))return;
    if(k)colocado[id]=k;else delete colocado[id];
    sel=null;marca();desenha();
  }
  function marca(){Array.prototype.forEach.call(bank.children,function(c){c.classList.toggle("sel",c.dataset.k===sel);});}
  box.onclick=function(ev){
    var z=ev.target.closest("[data-zone]");if(!z)return;
    var id=z.getAttribute("data-zone");if(!ehBuraco(id))return;
    if(sel)ponha(id,sel);else if(colocado[id])ponha(id,null);
  };
  kinds.forEach(function(k){
    var c=el('<button class="fchip" data-k="'+k+'" aria-label="'+NOMEF[k]+'">'+miniForma(k,"")+'</button>');
    arrastavel(c,k,alvoEm,function(kk,a){
      if(a&&a.getAttribute("data-zone"))ponha(a.getAttribute("data-zone"),kk);
    },function(kk){sel=(sel===kk)?null:kk;marca();});
    bank.appendChild(c);
  });
  desenha();
  botaoConferir(acao,function(){
    var erros=q.fx.n.filter(function(n){return ehBuraco(n.i)&&kn(colocado[n.i])!==kn(n.k);});
    var ok=erros.length===0;
    julgar(q,ok,ok?null:"Confira: "+erros.map(function(n){return "“"+String(n.t).replace(/\n/g," ")+"” é "+NOMEF[n.k];}).join("; ")+".");
  });
};

/* ---- completar o codigo a partir do fluxograma ---- */
function sCodeBlanks(lines,fill){
  return '<div class="scene code">'+lines.map(function(l,i){
    var out="",last=0,m,re=/\{(\d+)\}/g;
    while((m=re.exec(l))){
      out+=esc(l.slice(last,m.index));
      var b=m[1],v=fill[b];
      out+='<span class="blank'+(v!=null?' full':'')+'" data-blank="'+b+'">'+(v!=null?esc(v):'&nbsp;&nbsp;&nbsp;')+'</span>';
      last=re.lastIndex;
    }
    out+=esc(l.slice(last));
    return '<div class="cline"><span class="cno">'+(i+1)+'</span><span class="ccode">'+out+'</span></div>';
  }).join("")+'</div>';
}
RENDER.compl=function(q,area,acao){
  var fill={},sel=null;
  area.innerHTML=sFluxo(q.fx);
  var code=el('<div id="cblk"></div>');area.appendChild(code);
  area.appendChild(el('<p class="sub">Toque numa peça e depois na lacuna, ou arraste a peça até ela. Toque numa lacuna cheia para esvaziar.</p>'));
  var bank=el('<div class="wordbank"></div>');area.appendChild(bank);
  function desenha(){
    code.innerHTML=sCodeBlanks(q.code,fill);
    ligarConferir(Object.keys(fill).length===q.resp.length);
  }
  function marca(){Array.prototype.forEach.call(bank.children,function(c){c.classList.toggle("sel",c.dataset.w===sel);});}
  function ponha(b,w){if(w!=null)fill[b]=w;else delete fill[b];sel=null;marca();desenha();}
  code.onclick=function(ev){
    var z=ev.target.closest("[data-blank]");if(!z)return;
    var b=z.getAttribute("data-blank");
    if(sel!=null)ponha(b,sel);else if(fill[b]!=null)ponha(b,null);
  };
  var vistos={},palavras=[];
  q.resp.concat(q.extras||[]).forEach(function(w){if(!vistos[w]){vistos[w]=1;palavras.push(w);}});
  shuffle(palavras).forEach(function(w){
    var c=el('<button class="chip mono" data-w="'+esc(w)+'">'+esc(w)+'</button>');
    arrastavel(c,w,alvoEm,function(ww,a){
      if(a&&a.getAttribute("data-blank")!=null)ponha(a.getAttribute("data-blank"),ww);
    },function(ww){sel=(sel===ww)?null:ww;marca();});
    bank.appendChild(c);
  });
  desenha();
  botaoConferir(acao,function(){
    var ok=q.resp.every(function(r,i){return fill[i]===r;});
    julgar(q,ok,ok?null:"As peças certas, na ordem das lacunas, são: "+q.resp.join(", ")+".");
  });
};

/* ---- executar o fluxograma ---- */
function evalExp(expr,vars){
  var nomes=Object.keys(vars),vals=nomes.map(function(k){return vars[k];});
  return Function.apply(null,nomes.concat(["return ("+expr+");"])).apply(null,vals);
}
function planoExec(sp,ent){
  var N={};sp.n.forEach(function(d){N[d.i]=d;});
  var cur=sp.n.filter(function(d){return d.k==="inicio";})[0].i,vars={},saida=[],passos=[],g=0;
  function prox(id,lab){var es=sp.e.filter(function(e){return e[0]===id&&(lab===undefined||e[2]===lab);});return es.length?es[0][1]:null;}
  while(cur&&g++<80){
    var n=N[cur],p={id:cur,k:n.k,t:String(n.t).replace(/\n/g," ")},nx=null;
    if(n.k==="entrada"){n.t.split(",").forEach(function(nm){nm=nm.trim();vars[nm]=ent[nm];});nx=prox(cur);}
    else if(n.k==="proc"){var i=n.t.indexOf("←"),nm2=n.t.slice(0,i).trim();vars[nm2]=evalExp(n.t.slice(i+1).replace(/\n/g," "),vars);p.nome=nm2;p.val=vars[nm2];nx=prox(cur);}
    else if(n.k==="saida"){p.txt=evalExp("["+n.t+"]",vars).join("");saida.push(p.txt);nx=prox(cur);}
    else if(n.k==="decisao"){p.res=!!evalExp(n.t.replace(/\?\s*$/,""),vars);nx=prox(cur,p.res?"Sim":"Não");}
    else nx=prox(cur);
    p.vars=JSON.parse(JSON.stringify(vars));p.saida=saida.slice();passos.push(p);
    cur=(n.k==="fim")?null:nx;
  }
  return passos;
}
RENDER.exec=function(q,area,acao){
  var pl=planoExec(q.fx,q.entradas||{}),i=0,erros=0,nomes=[];
  pl.forEach(function(p){Object.keys(p.vars).forEach(function(k){if(nomes.indexOf(k)<0)nomes.push(k);});});
  var flow=el('<div id="exflow"></div>');area.appendChild(flow);
  var dock=el('<div class="expanel"></div>'),pn=el('<div></div>');dock.appendChild(pn);area.appendChild(dock);
  acao.style.display="none";dock.appendChild(acao);
  botaoConferir(acao,function(){julgar(q,erros===0,erros?"Você errou "+erros+" passo"+(erros>1?"s":"")+" no caminho.":null);});
  function tabela(){
    var ant=i>0?pl[i-1]:null,v=ant?ant.vars:{};
    if(!nomes.length)return "";
    return '<table class="extab"><tr>'+nomes.map(function(n){return '<th>'+esc(n)+'</th>';}).join("")+'</tr><tr>'+
      nomes.map(function(n){return '<td>'+(v[n]!==undefined?esc(v[n]):'–')+'</td>';}).join("")+'</tr></table>';
  }
  function usados(p,v){
    var us=Object.keys(v).filter(function(k){return new RegExp("\\b"+k+"\\b").test(p.t);});
    return us.length?us.map(function(k){return k+" = "+v[k];}).join(" e "):"";
  }
  function errou(el0,dica){erros++;el0.classList.remove("shake");void el0.offsetWidth;el0.classList.add("shake");pn.querySelector(".exmsg").textContent=dica;}
  function avanca(){i++;mostra();}
  function opcoes(p,v){
    var x=p.val,c=[x];
    [x+1,x-1,x*2,(v&&v[p.nome]!==undefined)?v[p.nome]:x+2].forEach(function(y){if(c.indexOf(y)<0&&y>=0)c.push(y);});
    return c.slice(0,4).sort(function(a,b){return a-b;});
  }
  function mostra(){
    var p=pl[i],ant=i>0?pl[i-1]:null,v=ant?ant.vars:{};
    flow.innerHTML=sFluxo(q.fx,{cur:p.id,max:320});
    var tela=ant&&ant.saida.length?ant.saida.join("\n"):"";
    var h=tabela()+'<div class="extela">'+(tela?esc(tela):'<span style="opacity:.5">tela do programa</span>')+'</div><p class="exmsg"></p><div class="exbtns"></div>';
    pn.innerHTML=h;
    var msg=pn.querySelector(".exmsg"),bt=pn.querySelector(".exbtns");
    function go(txt){var b=el('<button class="btn exgo">'+txt+'</button>');b.onclick=avanca;bt.appendChild(b);}
    if(p.k==="inicio"){msg.textContent="Comece no INÍCIO.";go("Começar");}
    else if(p.k==="entrada"){
      msg.textContent="ENTRADA: a pessoa digitou "+p.t.split(",").map(function(n){return p.vars[n.trim()]+" para "+n.trim();}).join(" e ")+".";go("Continuar");
    }
    else if(p.k==="saida"){msg.textContent="SAÍDA: o programa mostra "+p.txt+" na tela.";go("Continuar");}
    else if(p.k==="proc"){
      msg.textContent="PROCESSAMENTO: "+p.t+". Quanto vale "+p.nome+" depois deste passo?";
      opcoes(p,v).forEach(function(x){
        var b=el('<button class="btn exopt">'+esc(x)+'</button>');
        b.onclick=function(){if(x===p.val)avanca();else errou(b,"Ainda não. Use os valores da tabela e faça a conta de "+p.t+".");};
        bt.appendChild(b);
      });
    }
    else if(p.k==="decisao"){
      var u=usados(p,v);
      msg.textContent="DECISÃO: "+p.t+(u?" Com "+u+", qual caminho?":" Qual caminho?");
      ["Sim","Não"].forEach(function(r){
        var b=el('<button class="btn exdec">'+r+'</button>');
        b.onclick=function(){if((r==="Sim")===p.res)avanca();else errou(b,"Ainda não. Troque os valores na pergunta e veja se ela é verdadeira.");};
        bt.appendChild(b);
      });
    }
    else{msg.textContent="FIM! O programa terminou. Toque em Conferir.";acao.style.display="block";ligarConferir(true);}
    var c=flow.querySelector(".fcur");if(c&&c.scrollIntoView){try{c.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(e){}}
  }
  mostra();
};

/* ---- missao no laboratorio (Portugol Web Studio / OneCompiler) ---- */
var FERR={
  portugol:{nome:"Abrir o Portugol Web Studio",url:"https://portugol.dev",
    passos:["Abra o Portugol Web Studio (botão acima).","Apague o exemplo e cole o modelo de código.","Complete o que falta, onde está o comentário //.","Clique em Executar. Quando o programa pedir, digite o seu valor de teste."]},
  java:{nome:"Abrir o OneCompiler (Java)",url:"https://onecompiler.com/java",
    passos:["Abra o OneCompiler (botão acima) e escolha Java.","Apague o exemplo e cole o modelo de código.","Complete o que falta, onde está o comentário //.","Na caixa STDIN, escreva o seu valor de teste (um por linha). Clique em Run."]}
};
function rng(sem){var a=Math.floor(h53(String(sem))%2147483646)+1;return function(m){a=(a*48271)%2147483647;return a%m;};}
var GEN={
  dobro:function(r){var n=3+r(17);return {teste:["n = "+n],stdin:[n],ac:[String(n*2)],modo:"num"};},
  media:function(r){var a=2+r(8),k=1+r(5);return {teste:["n1 = "+a,"n2 = "+(a+2*k)],stdin:[a,a+2*k],ac:[String(a+k)],modo:"num"};},
  aprov:function(r){var n=r(11);return {teste:["nota = "+n],stdin:[n],ac:[n>=6?"Aprovado":"Recuperação"],modo:"txt"};},
  conta:function(r){var n=3+r(5),s="";for(var i=1;i<=n;i++)s+=i;return {teste:["n = "+n],stdin:[n],ac:[s],modo:"dig"};}
};
function missaoDados(q){return GEN[q.gen](rng(q.gen+"|"+String(S.nome||"aluno").toLowerCase().trim()));}
function confereMissao(q,v){
  var d=missaoDados(q),a=d.ac[0];
  if(d.modo==="dig")return String(v).replace(/\D/g,"")===a;
  var x=norm(v),y=norm(a);if(x===y)return true;
  var fx=parseFloat(x),fy=parseFloat(y);return !isNaN(fx)&&!isNaN(fy)&&fx===fy;
}
RENDER.missao=function(q,area,acao){
  var f=FERR[q.ferr],d=missaoDados(q);
  area.innerHTML=sFluxo(q.fx,{row:temDecisao(q.fx)?88:62,max:temDecisao(q.fx)?290:200})+'<p style="margin:0 0 10px">'+esc(q.enun)+'</p>'+
    '<a class="btn ghost mtool" href="'+f.url+'" target="_blank" rel="noopener">'+f.nome+' ↗</a>'+
    '<ol class="mpass">'+f.passos.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ol>'+
    '<details class="mcode" open><summary>Modelo de código</summary>'+sCode(q.modelo)+
    '<button class="btn ghost small" id="copia" style="margin-top:8px">Copiar o modelo</button></details>'+
    '<div class="mtest">O seu valor de teste: <b>'+esc(d.teste.join("  e  "))+'</b>'+
    (q.ferr==="java"?'<br>Na caixa STDIN escreva: <b>'+esc(d.stdin.join(" "))+'</b> (um por linha)':'')+'</div>';
  area.appendChild(el('<input type="text" id="resp" autocomplete="off" autocapitalize="none" placeholder="O que o seu programa mostrou">'));
  var inp=$("#resp");
  inp.addEventListener("input",function(){ligarConferir(inp.value.trim().length>0);});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&inp.value.trim()){var b=$("#conf");if(b)b.click();}});
  $("#copia").onclick=function(){
    var t=q.modelo.join("\n"),b=$("#copia");
    function ok(){b.textContent="Copiado!";}
    try{navigator.clipboard.writeText(t).then(ok,function(){b.textContent="Selecione e copie o código acima";});}
    catch(e){b.textContent="Selecione e copie o código acima";}
  };
  botaoConferir(acao,function(){
    var ok=confereMissao(q,inp.value);
    julgar(q,ok,ok?null:"Confira o programa e o seu valor de teste, rode de novo e digite o que apareceu.");
  });
};

function shuffleIdx(q){var a=[];for(var i=0;i<q.opts.length;i++)a.push(i);return shuffle(a);}

function julgar(q,ok,msg){
  if(!jogo||jogo.travado)return;          /* uma resposta por questão: ignora toques extras */
  jogo.travado=true;document.body.classList.add("travado");
  if(cron){clearInterval(cron);cron=null;}
  if(q._vista!==true){ q._vista=true; regHab(q,ok); if(ok)jogo.acertosPrimeira++; }
  if(ok){ jogo.respondidas++; S.xp+=q._rep?4:10; }
  else{ jogo.vidas--; }
  save();

  var f=el('<div class="feed '+(ok?"good":"bad")+'"><div class="inner">'+
    '<b>'+(ok?"Isso mesmo":"Ainda não")+'</b>'+
    '<p>'+esc(msg?msg+" ":"")+esc(q.e)+'</p>'+
    '<button class="btn '+(ok?"ok":"")+'" id="cont">Continuar</button></div></div>');
  document.body.appendChild(f);
  var bc=f.querySelector("#cont");
  bc.onclick=function(){
    if(bc._ok)return;bc._ok=true;
    f.remove();document.body.classList.remove("travado");
    if(!ok){
      if(jogo.vidas<=0){fimNivel(false);return;}
      var copia={};for(var k in q)copia[k]=q[k];copia._rep=true;copia._vista=true;
      jogo.fila.push(copia);
    }
    jogo.idx++;proxima();
  };
  bc.focus();
}

function fimNivel(venceu){
  var lv=jogo.lv;
  var metaAntes=metaOk();
  var pct=Math.round(jogo.acertosPrimeira/jogo.total*100);
  var estrelas=0;
  if(venceu)estrelas = pct>=100?3 : pct>=75?2 : 1;

  if(venceu){
    var ant=S.niveis[lv.id];
    if(!ant||pct>=ant.pct){
      S.niveis[lv.id]={estrelas:Math.max(estrelas,ant?ant.estrelas:0),pct:pct,hab:jogo.hab,
                       quando:new Date().toISOString().slice(0,10)};
    }else{
      ant.estrelas=Math.max(ant.estrelas,estrelas);
    }
    if(estrelas===3)S.xp+=20;
    save();
  }
  var st="";for(var k=1;k<=3;k++)st+=(k<=estrelas?"★":"☆");
  app.innerHTML=topo('<div class="grow"><b style="font-size:15px">'+esc(lv.nome)+'</b></div>')+
    '<div class="card" style="text-align:center">'+
      '<div style="font-size:46px;line-height:1">'+(venceu?lv.glyph:"💤")+'</div>'+
      '<h2 style="margin-top:8px">'+(venceu?"Nível concluído":"Vidas acabaram")+'</h2>'+
      (!metaAntes&&metaOk()?'<div class="metabox">🎯 Meta da aula concluída! Agora escolha: bônus ou Chefão.</div>':'')+
      '<div class="stars" style="font-size:30px;margin:6px 0">'+st+'</div>'+
      '<p class="sub">'+(venceu
         ? "Acertos de primeira: "+pct+"% · "+jogo.acertosPrimeira+" de "+jogo.total
         : "Revise a teoria e volte. O melhor resultado anterior continua salvo.")+'</p>'+
    '</div>'+
    (venceu&&pct<100?'<div class="warn">Refaça o nível para tentar as 3 estrelas: as questões vêm embaralhadas.</div>':'')+
    '<button class="btn" id="mapa">Voltar para a trilha</button>'+
    '<button class="btn ghost small" id="denovo">'+(venceu?"Jogar de novo":"Tentar de novo")+'</button>';
  $("#mapa").onclick=telaMapa;
  $("#denovo").onclick=function(){ limparVistos(lv); iniciarNivel(lv); };
  window.scrollTo(0,0);
}
function limparVistos(lv){lv.qs.forEach(function(q){delete q._vista;});}

/* ============================================================ RELATÓRIO ============================================================ */
function agregarHab(){
  var r={};
  Object.keys(HAB).forEach(function(h){r[h]={c:0,t:0};});
  LEVELS.forEach(function(lv){
    var st=S.niveis[lv.id];if(!st||!st.hab)return;
    for(var h in st.hab){ if(!r[h])r[h]={c:0,t:0}; r[h].c+=st.hab[h].c; r[h].t+=st.hab[h].t; }
  });
  return r;
}
function codigo(){
  var base=S.nome+"|"+S.xp+"|"+concluidos()+"|"+totalEstrelas()+"|"+GAME.eyebrow+"|"+(new Date().toISOString().slice(0,10));
  var h=5381;for(var i=0;i<base.length;i++){h=((h<<5)+h+base.charCodeAt(i))>>>0;}
  return h.toString(36).toUpperCase().slice(0,6).padStart(6,"X");
}
function medalha(){
  var f=concluidos(),e=totalEstrelas(),totalNv=LEVELS.length;
  if(f>=totalNv&&e>=totalNv*3-2)return ["🏆","Mestre(a) dos Fluxogramas"];
  if(f>=totalNv)return ["🥇","Nenhuma figura escapou"];
  if(f>=Math.ceil(totalNv*0.6))return ["🥈","Desenhista em treino"];
  if(f>=Math.ceil(totalNv*0.3))return ["🥉","Aprendiz de fluxograma"];
  return ["🧩","Começando agora"];
}

function telaRelatorio(){
  if(!S.nome){telaInicio();return;}
  var hab=agregarHab(),med=medalha(),totalNv=LEVELS.length,fim=concluidos()>=totalNv;
  var h=topo('<button class="iconbtn" id="volta">←</button><div class="grow"><b style="font-size:15px">Relatório</b></div>');
  h+='<div class="medal"><span class="m">'+med[0]+'</span><div><b>'+med[1]+'</b><div class="sub">'+esc(S.nome)+(S.turma?' · '+esc(S.turma):'')+'</div></div></div>';
  if(!fim)h+='<div class="warn">Relatório parcial: faltam '+(totalNv-concluidos())+' nível(is). Dá para continuar em casa e gerar de novo.</div>';

  h+='<div class="card"><h3>Resumo</h3>'+
     kv("Meta da aula",metaTxt())+
     kv("Níveis concluídos",concluidos()+" de "+totalNv)+
     kv("Estrelas",totalEstrelas()+" de "+(totalNv*3))+
     kv("XP",S.xp)+
     kv("Tempo de estudo",fmtTempo(S.tempo||0))+
     kv("Sessões",(S.sessoes||1))+
     kv("Saídas da página durante o jogo",(S.saidas||0))+
     (S.liberarTudo?kv("Fases liberadas pelo professor","sim"):"")+
     kv("Data",new Date().toLocaleDateString("pt-BR"))+
     '</div>';

  h+='<div class="card"><h3>Habilidades avaliadas</h3>';
  Object.keys(HAB).forEach(function(k){
    var d=hab[k],p=d.t?Math.round(d.c/d.t*100):0;
    var cor=!d.t?"var(--line)":p>=75?"var(--ok)":p>=50?"var(--gold)":"var(--bad)";
    h+='<div class="skill"><div class="hd"><span>'+esc(HAB[k])+'</span><i>'+(d.t?p+"%":"—")+'</i></div>'+
       '<div class="bar"><i style="width:'+p+'%;background:'+cor+'"></i></div></div>';
  });
  h+='</div>';

  var fracos=Object.keys(HAB).filter(function(k){var d=hab[k];return d.t&&d.c/d.t<0.75;});
  h+='<div class="card"><h3>O que revisar antes da prova</h3>'+
      (fracos.length? '<ul style="padding-left:20px;margin:0">'+fracos.map(function(k){return "<li>"+esc(HAB[k])+"</li>";}).join("")+'</ul>'
       : '<p class="sub" style="margin:0">'+(concluidos()?"Nada pendente até aqui. Refaça os níveis de menos estrelas para fixar.":"Jogue pelo menos um nível para o relatório mostrar as habilidades.")+'</p>')+
     '</div>';

  h+='<div class="card" style="text-align:center"><h3>Código de verificação</h3>'+
     '<div class="code">'+codigo()+'</div>'+
     '<p class="sub" style="margin:6px 0 0">Mostre este código junto com o print.</p></div>';

  h+='<button class="btn" id="png">Baixar relatório em imagem</button>'+
     '<button class="btn ghost small" id="print">Imprimir ou salvar em PDF</button>'+
     '<button class="btn ghost small" id="volta2">Voltar para a trilha</button>'+
     '<div class="note">Envie a imagem (ou o print desta tela) no Google Classroom.</div>'+
     '<div id="saida"></div>';
  app.innerHTML=h;
  $("#volta").onclick=$("#volta2").onclick=telaMapa;
  $("#print").onclick=function(){window.print();};
  $("#png").onclick=function(){gerarPNG(hab,med);};
  window.scrollTo(0,0);
}
function kv(a,b){return '<div class="kv"><span>'+a+'</span><b>'+b+'</b></div>';}

var COR_TEMA="#274a9c";
function gerarPNG(hab,med){
  var totalNv=LEVELS.length;
  var W=900,H=1282,c=document.createElement("canvas");c.width=W;c.height=H;
  var x=c.getContext("2d");
  var F='"Segoe UI",Roboto,system-ui,sans-serif';
  x.fillStyle="#ffffff";x.fillRect(0,0,W,H);
  x.fillStyle=COR_TEMA;x.fillRect(0,0,W,120);
  x.fillStyle="#ffffff";x.font="700 30px "+F;x.fillText(GAME.eyebrow,48,58);
  x.font="400 19px "+F;x.fillText(GAME.titulo.replace(/<[^>]+>/g,"")+" · relatório de treino",48,92);

  var y=170;
  x.fillStyle="#0f2230";x.font="700 30px "+F;x.fillText(S.nome,48,y);y+=34;
  x.fillStyle="#4a6478";x.font="400 20px "+F;
  x.fillText((S.turma||"Turma não informada")+"  ·  "+new Date().toLocaleDateString("pt-BR"),48,y);y+=46;

  x.fillStyle="#fdf0d4";x.fillRect(48,y-28,W-96,64);
  x.fillStyle="#e0900a";x.fillRect(48,y-28,6,64);
  x.fillStyle="#0f2230";x.font="700 24px "+F;x.fillText(med[0]+"  "+med[1],70,y+10);y+=88;

  function linha(a,b){
    x.fillStyle="#4a6478";x.font="400 20px "+F;x.fillText(a,48,y);
    x.fillStyle="#0f2230";x.font="700 20px "+F;x.textAlign="right";x.fillText(String(b),W-48,y);x.textAlign="left";
    x.strokeStyle="#e2eaf0";x.beginPath();x.moveTo(48,y+12);x.lineTo(W-48,y+12);x.stroke();y+=42;
  }
  x.fillStyle="#0f2230";x.font="700 22px "+F;x.fillText("Resumo",48,y);y+=34;
  linha("Meta da aula",metaTxt());
  linha("Níveis concluídos",concluidos()+" de "+totalNv);
  linha("Estrelas",totalEstrelas()+" de "+(totalNv*3));
  linha("XP acumulado",S.xp);
  linha("Tempo de estudo",fmtTempo(S.tempo||0));
  linha("Sessões",(S.sessoes||1));
  linha("Saídas da página durante o jogo",(S.saidas||0));
  y+=22;

  x.fillStyle="#0f2230";x.font="700 22px "+F;x.fillText("Habilidades avaliadas",48,y);y+=34;
  Object.keys(HAB).forEach(function(k){
    var d=hab[k],p=d.t?Math.round(d.c/d.t*100):0;
    x.fillStyle="#0f2230";x.font="400 16px "+F;
    var txt=HAB[k];
    x.fillText(txt.length>66?txt.slice(0,64)+"…":txt,48,y);
    x.textAlign="right";x.font="700 17px "+F;x.fillText(d.t?p+"%":"—",W-48,y);x.textAlign="left";
    y+=12;
    x.fillStyle="#e2eaf0";x.fillRect(48,y,W-96,12);
    x.fillStyle=!d.t?"#c6d4de":p>=75?"#1f8a4c":p>=50?"#e0900a":"#c23b4d";
    x.fillRect(48,y,(W-96)*p/100,12);
    y+=38;
  });

  y+=10;
  x.fillStyle="#f3f7fa";x.fillRect(48,y,W-96,74);
  x.fillStyle="#4a6478";x.font="400 18px "+F;x.fillText("Código de verificação",70,y+30);
  x.fillStyle=COR_TEMA;x.font="700 30px ui-monospace,Consolas,monospace";x.fillText(codigo(),70,y+62);
  x.fillStyle="#4a6478";x.font="400 16px "+F;x.textAlign="right";
  x.fillText("Rosival Silva · 2026",W-70,y+62);x.textAlign="left";

  var saida=$("#saida");saida.innerHTML="";
  try{
    c.toBlob(function(b){
      if(!b){saida.appendChild(c);return;}
      var u=URL.createObjectURL(b),a=document.createElement("a");
      a.href=u;a.download="relatorio-"+STORE+"-"+norm(S.nome).replace(/ /g,"-")+".png";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},4000);
      saida.appendChild(el('<div class="note" style="margin-top:12px">Se o download não abrir, use a imagem abaixo: segure o dedo sobre ela para salvar.</div>'));
      saida.appendChild(c);
    },"image/png");
  }catch(e){
    saida.appendChild(el('<div class="note" style="margin-top:12px">Segure o dedo sobre a imagem para salvar.</div>'));
    saida.appendChild(c);
  }
  setTimeout(function(){saida.scrollIntoView({behavior:"smooth",block:"start"});},300);
}
